<style>
    .highlight {
        max-height: 400px;
        overflow: hidden;
        position: relative;
    }

    .code-show {
        max-height: none !important;
    }

    .code-more-box {
        width: 100%;
        padding-top: 78px;
        background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0), #fff);
        position: absolute;
        left: 0;
        bottom: 0;
        z-index: 1;
    }

    .code-more-btn {
        display: block;
        margin: 0 auto;
        width: 44px;
        height: 22px;
        background: #f0f0f5;
        border-top-left-radius: 8px;
        border-top-right-radius: 8px;
        padding-top: 6px;
        cursor: pointer;
    }

    .code-more-img {
        display: block;
        margin: 0 auto;
        width: 22px;
        height: 16px;
    }

    #backTopBtn {
        display: none;
        position: fixed;
        bottom: 30px;
        right: 20px;
        z-index: 99;
        cursor: pointer;
        width: 30px;
        height: 30px;
        background-image: url({{ (resources.Get "icons/backtop.png").RelPermalink }});
        background-size: cover;
        background-repeat: no-repeat;
    }
</style>

<script>
    function initCodeMoreBox() {
        try {
            const codeBlocks = document.querySelectorAll(".highlight");
            if (!codeBlocks.length) return;

            codeBlocks.forEach(codeBlock => {
                if (codeBlock.scrollHeight <= codeBlock.clientHeight) return;

                const codeMoreBox = document.createElement('div');
                codeMoreBox.classList.add('code-more-box');

                const codeMoreBtn = document.createElement('span');
                codeMoreBtn.classList.add('code-more-btn');

                const img = document.createElement('img');
                img.classList.add('code-more-img');
                img.src = "{{ (resources.Get "icons/codemore.png").RelPermalink }}";
                img.alt = 'Show more';

                codeMoreBtn.addEventListener('click', () => {
                    codeBlock.classList.add('code-show');
                    codeMoreBox.style.display = 'none';
                    window.dispatchEvent(new Event('resize'));
                });

                codeMoreBtn.appendChild(img);
                codeMoreBox.appendChild(codeMoreBtn);
                codeBlock.appendChild(codeMoreBox);
            });
        } catch (error) {
            console.error('Error in initCodeMoreBox:', error);
        }
    }

    function initScrollTop() {
        try {
            const rightSideBar = document.querySelector(".right-sidebar");
            if (!rightSideBar) {
                console.warn('Right sidebar not found');
                return;
            }

            const btn = document.createElement("div");
            btn.id = "backTopBtn";
            btn.onclick = backToTop;
            rightSideBar.appendChild(btn);

            window.onscroll = function () {
                if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                    btn.style.display = "block";
                } else {
                    btn.style.display = "none";
                }
            };
        } catch (error) {
            console.error('Error in initScrollTop:', error);
        }
    }

    function backToTop() {
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* ⌘K / Ctrl+K 聚焦右栏搜索框（对应设计稿里的快捷键提示）*/
    function initSearchShortcut() {
        try {
            const input = document.querySelector('.search-form input[name="keyword"]');
            if (!input) return;

            document.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    input.focus();
                    input.select();
                }
            });
        } catch (error) {
            console.error('Error in initSearchShortcut:', error);
        }
    }

    function initTocFolding() {
        const navigation = document.querySelector('.widget--toc #TableOfContents');
        if (!navigation) return;

        const sections = [];
        const widget = navigation.closest('.widget');
        const title = widget && widget.querySelector('.widget-title');
        const toggleAll = document.createElement('button');

        function updateToggleAll() {
            const allExpanded = sections.every(({ children }) => !children.hidden);
            toggleAll.textContent = allExpanded ? '收起' : '展开';
            toggleAll.setAttribute('aria-expanded', String(allExpanded));
            toggleAll.setAttribute('aria-label', `${allExpanded ? '收起' : '展开'}全部子目录`);
        }

        function setExpanded(section, expanded) {
            section.children.hidden = !expanded;
            section.button.setAttribute('aria-expanded', String(expanded));
            section.button.setAttribute('aria-label', `${expanded ? '收起' : '展开'}「${section.title}」的子目录`);
        }

        navigation.querySelectorAll(':scope > ul > li').forEach((item, index) => {
            const children = item.querySelector(':scope > ul');
            const link = item.querySelector(':scope > a');
            if (!children || !link) return;

            children.id = `toc-section-${index + 1}`;
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'toc-section-toggle';
            button.setAttribute('aria-controls', children.id);
            const section = { children, button, title: link.textContent.trim() || '章节' };
            sections.push(section);
            setExpanded(section, true);
            button.addEventListener('click', () => {
                setExpanded(section, children.hidden);
                updateToggleAll();
            });
            link.after(button);
        });

        if (!title || !sections.length) return;
        toggleAll.type = 'button';
        toggleAll.className = 'toc-toggle-all';
        toggleAll.setAttribute('aria-controls', sections.map(({ children }) => children.id).join(' '));
        toggleAll.addEventListener('click', () => {
            const expand = sections.some(({ children }) => children.hidden);
            sections.forEach(section => setExpanded(section, expand));
            updateToggleAll();
        });
        updateToggleAll();
        title.after(toggleAll);
    }

    document.addEventListener('DOMContentLoaded', () => {
        initCodeMoreBox();
        initScrollTop();
        initSearchShortcut();
        initTocFolding();
        initBookChain();
    });

    /* ── 篇尾续读（scroll chaining） ──────────────────────────────
       滑到当前文章底部时，fetch 同书同章的下一篇，提取其 <article>
       插入页面，pushState 更新 URL。数据由 #book-chain div 注入。
       到底时显示「已是本书最后一篇」。 */
    function initBookChain() {
        try {
            const el = document.getElementById('book-chain');
            if (!el || el.dataset.isLast === 'true') return;

            const nextUrl = el.dataset.nextUrl;
            if (!nextUrl) return;

            let loading = false;
            let loaded = false;

            function onScroll() {
                if (loaded || loading) return;
                const doc = document.documentElement;
                const scrollBottom = doc.scrollHeight - doc.scrollTop - doc.clientHeight;
                if (scrollBottom > 800) return;

                loading = true;
                fetch(nextUrl)
                    .then(r => r.text())
                    .then(html => {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        const article = doc.querySelector('article.main-article');
                        if (!article) return;

                        /* 插入分隔线 + 下一篇 */
                        const divider = document.createElement('div');
                        divider.className = 'book-chain-divider';
                        divider.innerHTML = `<hr><p class="book-chain-label">下一篇：${el.dataset.nextTitle}${el.dataset.nextChapter ? '（' + el.dataset.nextChapter + '）' : ''}</p>`;

                        const main = document.querySelector('main.main');
                        if (!main) return;
                        main.appendChild(divider);
                        main.appendChild(article.cloneNode(true));

                        /* 更新 URL（不跳转） */
                        history.pushState({}, '', nextUrl);
                        document.title = doc.title;

                        /* 重新跑代码块折叠、TOC 等 */
                        initCodeMoreBox();
                        initTocFolding();

                        loaded = true;
                    })
                    .catch(() => { loading = false; });
            }

            window.addEventListener('scroll', onScroll, { passive: true });
        } catch (e) {
            console.error('book-chain error:', e);
        }
    }
</script>

{{/* 仅当页面包含 mermaid 代码块时加载渲染脚本（标记由 render-codeblock-mermaid.html 写入 Page Store） */}}
{{ if .Store.Get "hasMermaid" }}
<script src="{{ "js/mermaid.min.js" | relURL }}"></script>
<script>
    (function () {
        let rendering = false;

        function renderMermaid() {
            const nodes = document.querySelectorAll('.mermaid');
            if (!nodes.length || typeof mermaid === 'undefined' || rendering) return;
            rendering = true;

            nodes.forEach(el => {
                if (!el.dataset.src) el.dataset.src = el.textContent;
                el.removeAttribute('data-processed');
                el.textContent = el.dataset.src;
            });

            const dark = document.documentElement.dataset.scheme === 'dark';
            mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default' });

            Promise.all([...nodes].map(el =>
                mermaid.run({ nodes: [el] }).catch(err => {
                    console.error('Mermaid render error:', err);
                })
            )).then(() => { rendering = false; });
        }

        renderMermaid();
        /* 跟随主题明暗切换重绘。主题脚本（defer）初始化时会额外派发一次事件，
           与首渲染撞车会导致图渲染失败，故渲染进行中的触发直接忽略。 */
        window.addEventListener('onColorSchemeChange', renderMermaid);
    })();
</script>
{{ end }}
