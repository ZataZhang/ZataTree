<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="验证码发送流程中，发信失败被吞掉，重试命中冷却锁只显示中性提示">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5B87BF"/></marker></defs>
  <rect width="1000" height="400" fill="#0B1220"/>
  <text x="40" y="44" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">为什么页面只说「已发送」，日志却一片空白</text>
  <text x="40" y="96" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="16" fill="#9FB3D1">第 1 次点击</text>
  <rect x="140" y="72" width="170" height="44" rx="10" fill="#101a2e" stroke="#3b4a68" stroke-width="2"/><text x="160" y="100" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="15" fill="#F8FAFC">抢 60 秒冷却锁 ✓</text>
  <rect x="370" y="72" width="170" height="44" rx="10" fill="#101a2e" stroke="#3b4a68" stroke-width="2"/><text x="390" y="100" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="15" fill="#F8FAFC">调用 SMTP 发信</text>
  <rect x="600" y="72" width="170" height="44" rx="10" fill="#2a1515" stroke="#F87171" stroke-width="2"/><text x="620" y="100" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="15" fill="#F87171">抛异常 → 被吞掉</text>
  <rect x="820" y="72" width="140" height="44" rx="10" fill="#101a2e" stroke="#3b4a68" stroke-width="2"/><text x="838" y="100" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="15" fill="#9FB3D1">通用错误页</text>
  <line x1="310" y1="94" x2="364" y2="94" stroke="#5B87BF" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="540" y1="94" x2="594" y2="94" stroke="#5B87BF" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="770" y1="94" x2="814" y2="94" stroke="#5B87BF" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="600" y="142" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="14" fill="#64748B">日志无记录；锁已占用，挑战未保存</text>
  <text x="40" y="216" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="16" fill="#9FB3D1">60 秒内重试</text>
  <rect x="140" y="192" width="170" height="44" rx="10" fill="#101a2e" stroke="#3b4a68" stroke-width="2"/><text x="160" y="220" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="15" fill="#F8FAFC">抢锁失败</text>
  <rect x="370" y="192" width="170" height="44" rx="10" fill="#101a2e" stroke="#3b4a68" stroke-width="2"/><text x="390" y="220" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="15" fill="#F8FAFC">没有可复用的挑战</text>
  <rect x="600" y="192" width="360" height="44" rx="10" fill="#14233a" stroke="#22D3EE" stroke-width="2"/><text x="620" y="220" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="15" fill="#22D3EE">「如果地址能接收验证码，验证码已发送」</text>
  <line x1="310" y1="214" x2="364" y2="214" stroke="#5B87BF" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="540" y1="214" x2="594" y2="214" stroke="#5B87BF" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="40" y="280" width="920" height="84" rx="12" fill="#101a2e" stroke="#2c3a58" stroke-width="1.5"/>
  <text x="62" y="312" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="15" fill="#F8FAFC">中性提示本身是为了防止探测邮箱是否注册，应该保留。</text>
  <text x="62" y="342" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="15" fill="#9FB3D1">要补的是失败日志：记录渠道和异常类型，不记录邮箱和手机号。</text>
</svg>
