<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Keycloak 接入手机号和邮箱验证码登录的三个坑">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5B87BF"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#26324a"/></pattern>
  </defs>
  <rect width="1200" height="400" fill="#0B1220"/>
  <rect width="1200" height="400" fill="url(#dots)" opacity="0.55"/>
  <rect x="0" y="0" width="6" height="400" fill="url(#accent)"/>
  <text x="1104" y="64" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="20" fill="#64748B">zata.cc</text>
  <g transform="translate(800,110)">
    <rect x="0" y="0" width="300" height="56" rx="12" fill="#101a2e" stroke="#3b4a68" stroke-width="2"/>
    <text x="24" y="36" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="22" fill="#9FB3D1">看不见：详情页无手机号</text>
    <rect x="0" y="76" width="300" height="56" rx="12" fill="#101a2e" stroke="#3b4a68" stroke-width="2"/>
    <text x="24" y="112" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="22" fill="#9FB3D1">搜不到：属性只认全值</text>
    <rect x="0" y="152" width="300" height="56" rx="12" fill="#101a2e" stroke="url(#accent)" stroke-width="2"/>
    <text x="24" y="188" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="22" fill="#F8FAFC">发不出：SMTP 未生效</text>
  </g>
  <text x="96" y="166" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="40" font-weight="700" fill="#F8FAFC">Keycloak 接手机号和邮箱验证码</text>
  <text x="96" y="238" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="40" font-weight="700" fill="#F8FAFC">看不见、搜不到、发不出</text>
  <rect x="96" y="264" width="112" height="6" rx="3" fill="url(#accent)"/>
  <rect x="96" y="296" width="120" height="42" rx="21" fill="#152238" stroke="#2c3a58" stroke-width="1.5"/>
  <text x="114" y="324" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="21" fill="#9FB3D1">软件架构</text>
  <rect x="230" y="296" width="177" height="42" rx="21" fill="#152238" stroke="#2c3a58" stroke-width="1.5"/>
  <text x="248" y="324" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="21" fill="#9FB3D1">DevOps 与平台</text>
</svg>
