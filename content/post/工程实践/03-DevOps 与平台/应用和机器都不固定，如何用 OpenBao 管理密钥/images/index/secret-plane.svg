<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">OpenBao 为不同部署中的应用提供受限 secret</title>
  <desc id="desc">人工身份、部署平台、虚拟机 Agent 和云工作负载通过不同身份连接 OpenBao，并按应用策略获取所需密钥。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5B87BF"/></marker>
    <style>
      .bg{fill:#F5F8FC}.card{fill:#fff;stroke:#C9D7E8;stroke-width:2}.core{fill:#10233D;stroke:#5B87BF;stroke-width:3}.title{font:700 27px sans-serif;fill:#13243A}.h{font:700 21px sans-serif;fill:#17304E}.t{font:17px sans-serif;fill:#40566F}.small{font:15px sans-serif;fill:#60758C}.white{fill:#F8FAFC}.line{stroke:#5B87BF;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#8CA6C4;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="650" rx="20"/>
  <text class="title" x="60" y="58">统一 secret 来源，部署入口保留独立身份</text>
  <rect class="card" x="58" y="115" width="290" height="145" rx="16"/>
  <text class="h" x="86" y="155">人工运维</text>
  <text class="t" x="86" y="190">OIDC 身份 + 临时只读 policy</text>
  <text class="small" x="86" y="222">查看路径受限，访问可审计</text>
  <rect class="core" x="430" y="100" width="340" height="300" rx="22"/>
  <text class="white" x="475" y="153" style="font:700 29px sans-serif">OpenBao</text>
  <text class="white" x="475" y="195" style="font:18px sans-serif">KV / 动态凭证</text>
  <text class="white" x="475" y="234" style="font:18px sans-serif">身份验证与 policy</text>
  <text class="white" x="475" y="273" style="font:18px sans-serif">审计、版本、撤销</text>
  <text class="white" x="475" y="330" style="font:15px sans-serif;opacity:.8">每个身份只能读取授权路径</text>
  <rect class="card" x="850" y="95" width="290" height="125" rx="16"/>
  <text class="h" x="880" y="137">Dokploy</text>
  <text class="t" x="880" y="170">部署时解析 secret 引用</text>
  <text class="small" x="880" y="197">重新部署后取得轮换值</text>
  <rect class="card" x="850" y="255" width="290" height="125" rx="16"/>
  <text class="h" x="880" y="297">普通 VPS / Compose</text>
  <text class="t" x="880" y="330">Agent 认证并渲染到运行时</text>
  <text class="small" x="880" y="357">身份按应用与环境拆分</text>
  <rect class="card" x="850" y="415" width="290" height="125" rx="16"/>
  <text class="h" x="880" y="457">云工作负载</text>
  <text class="t" x="880" y="490">使用平台可验证的工作负载身份</text>
  <text class="small" x="880" y="517">避免烘焙长期 token</text>
  <rect class="card" x="58" y="365" width="290" height="145" rx="16"/>
  <text class="h" x="86" y="407">身份 / 引导服务</text>
  <text class="t" x="86" y="442">OIDC、机器身份或一次性凭据</text>
  <text class="small" x="86" y="474">回答“新实例是谁”</text>
  <path class="line" d="M348 188C390 188 390 188 430 188"/>
  <path class="line" d="M348 437C392 437 392 360 430 360"/>
  <path class="line" d="M770 155C808 155 808 155 850 155"/>
  <path class="line" d="M770 290C808 290 808 315 850 315"/>
  <path class="line" d="M770 365C810 365 810 477 850 477"/>
  <text class="small" x="384" y="170">人工认证</text>
  <text class="small" x="380" y="420">签发受限身份</text>
  <text class="small" x="782" y="135">按需读取</text>
  <text class="small" x="58" y="590">网络和服务器可以变化；应用身份、授权路径与审计规则保持可控。</text>
</svg>
