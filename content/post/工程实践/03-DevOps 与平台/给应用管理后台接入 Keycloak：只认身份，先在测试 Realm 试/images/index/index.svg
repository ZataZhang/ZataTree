<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="给应用管理后台接入 Keycloak：只认身份，先在测试 Realm 试">
  <defs><linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5B87BF"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#26324a"/></pattern></defs>
  <rect width="1200" height="400" fill="#0B1220"/><rect width="1200" height="400" fill="url(#dots)" opacity="0.55"/><rect x="0" y="0" width="6" height="400" fill="url(#accent)"/>
  <text x="1104" y="64" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="20" fill="#64748B">zata.cc</text>
  <text x="72" y="150" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="44" font-weight="700" fill="#E2E8F0">管理后台接入 Keycloak</text>
  <text x="72" y="210" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="26" fill="#9FB3D1">Keycloak 只证明你是谁，管理员仍由应用决定</text>
  <rect x="72" y="248" width="240" height="6" rx="3" fill="url(#accent)"/>
  <g transform="translate(800,110)" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="21">
    <rect x="0" y="0" width="300" height="56" rx="12" fill="#101a2e" stroke="#3b4a68" stroke-width="2"/><text x="24" y="36" fill="#9FB3D1">Client 不带任何角色</text>
    <rect x="0" y="76" width="300" height="56" rx="12" fill="#101a2e" stroke="#3b4a68" stroke-width="2"/><text x="24" y="112" fill="#9FB3D1">已验证邮箱只绑一次</text>
    <rect x="0" y="152" width="300" height="56" rx="12" fill="#101a2e" stroke="url(#accent)" stroke-width="2"/><text x="24" y="188" fill="#E2E8F0">先在测试 Realm 跑通</text>
  </g>
</svg>
