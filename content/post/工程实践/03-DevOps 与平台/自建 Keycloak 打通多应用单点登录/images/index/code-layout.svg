<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B87BF"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8B5CF6"/></marker>
  </defs>
  <rect width="1200" height="540" rx="24" fill="#F8FAFC"/>
  <text x="56" y="56" fill="#0F172A" font-family="sans-serif" font-size="28" font-weight="700">三处改动，各管一件事</text>
  <text x="56" y="88" fill="#64748B" font-family="sans-serif" font-size="17">身份中心只写配置；登录客户端只写一次；每个应用只填配置、跑迁移</text>

  <g font-family="sans-serif">
    <rect x="56" y="120" width="330" height="330" rx="18" fill="#EAF2FF" stroke="#5B87BF" stroke-width="2.5"/>
    <text x="221" y="158" text-anchor="middle" fill="#173B70" font-size="21" font-weight="700">zata-ops/deploy/keycloak</text>
    <text x="221" y="186" text-anchor="middle" fill="#475569" font-size="15">部署身份中心（不写 Keycloak 代码）</text>
    <g font-family="monospace" font-size="15" fill="#334155">
      <text x="86" y="230">docker-compose.yml</text>
      <text x="86" y="262">.env.example</text>
      <text x="86" y="294">realm/zata-realm.json</text>
      <text x="86" y="326">README.md</text>
    </g>
    <text x="86" y="378" fill="#475569" font-size="15">客户端、团队组、角色进版本库</text>
    <text x="86" y="404" fill="#475569" font-size="15">数据库沿用 zata-ops 的备份命令</text>

    <rect x="435" y="120" width="330" height="330" rx="18" fill="#F1ECFF" stroke="#8B5CF6" stroke-width="2.5"/>
    <text x="600" y="158" text-anchor="middle" fill="#5B21B6" font-size="21" font-weight="700">zata_code_template</text>
    <text x="600" y="186" text-anchor="middle" fill="#475569" font-size="15">OIDC 登录模块，只写一次</text>
    <g font-size="15" fill="#334155">
      <text x="465" y="230">• 配置开关：本地密码 / OIDC</text>
      <text x="465" y="262">• Authlib 登录与回调路由</text>
      <text x="465" y="294">• external_identities 映射表</text>
      <text x="465" y="326">• 角色检查 + 原会话签发</text>
    </g>
    <text x="465" y="378" fill="#475569" font-size="15">守住四层架构：协议细节放在</text>
    <text x="465" y="404" fill="#475569" font-size="15">infrastructure，用例放在 core</text>

    <rect x="814" y="120" width="330" height="330" rx="18" fill="#E7F8F4" stroke="#2A9D8F" stroke-width="2.5"/>
    <text x="979" y="158" text-anchor="middle" fill="#125C53" font-size="21" font-weight="700">各派生应用</text>
    <text x="979" y="186" text-anchor="middle" fill="#475569" font-size="15">freshai 先行，其余随后</text>
    <g font-size="15" fill="#334155">
      <text x="844" y="230">• just sync-template</text>
      <text x="844" y="262">• alembic 迁移出映射表</text>
      <text x="844" y="294">• 填 issuer / client 配置</text>
      <text x="844" y="326">• 处理老账号绑定</text>
    </g>
    <text x="844" y="378" fill="#475569" font-size="15">与模板分叉的登录代码</text>
    <text x="844" y="404" fill="#475569" font-size="15">（如 freshai）需手工合入</text>
  </g>
  <path d="M768 285 L808 285" stroke="#8B5CF6" stroke-width="3" marker-end="url(#p)"/>
  <path d="M979 452 C979 500 221 500 221 456" fill="none" stroke="#5B87BF" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#b)"/>
  <text x="600" y="516" text-anchor="middle" fill="#315EAA" font-family="sans-serif" font-size="15">新应用接入 = 在 realm 配置里登记一个 Client + 应用侧填三项配置</text>
</svg>
