<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="应用启动时依次从 OpenBao 和 Nacos 取值的流程">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22D3EE"/>
    </marker>
  </defs>
  <rect width="1200" height="500" fill="#0B1220"/>
  <g font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif">
    <rect x="330" y="40" width="570" height="420" rx="18" fill="none" stroke="#3b4a68" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="350" y="70" font-size="16" fill="#64748B">应用所在机器</text>

    <rect x="20" y="90" width="180" height="90" rx="14" fill="#101a2e" stroke="#22D3EE" stroke-width="2.5"/>
    <text x="110" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#F8FAFC">OpenBao</text>
    <text x="110" y="158" text-anchor="middle" font-size="15" fill="#9FB3D1">密钥 · 策略 · 审计</text>

    <rect x="360" y="90" width="220" height="90" rx="14" fill="#101a2e" stroke="#3b4a68" stroke-width="2.5"/>
    <text x="470" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#F8FAFC">OpenBao Agent</text>
    <text x="470" y="158" text-anchor="middle" font-size="15" fill="#9FB3D1">登录 · 续期 · 渲染</text>

    <rect x="360" y="340" width="220" height="90" rx="14" fill="#0e1730" stroke="#3b4a68" stroke-width="2.5"/>
    <text x="470" y="380" text-anchor="middle" font-size="20" font-weight="700" fill="#F8FAFC" font-family="ui-monospace,'SF Mono',Menlo,monospace">secrets.env</text>
    <text x="470" y="408" text-anchor="middle" font-size="15" fill="#9FB3D1">/run 内存目录 · 0400</text>

    <rect x="660" y="210" width="200" height="90" rx="14" fill="#101a2e" stroke="#3b4a68" stroke-width="2.5"/>
    <text x="760" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#F8FAFC">应用</text>
    <text x="760" y="278" text-anchor="middle" font-size="15" fill="#9FB3D1">project-a</text>

    <rect x="980" y="90" width="200" height="90" rx="14" fill="#101a2e" stroke="#5B87BF" stroke-width="2.5"/>
    <text x="1080" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#F8FAFC">Nacos</text>
    <text x="1080" y="158" text-anchor="middle" font-size="15" fill="#9FB3D1">普通配置 · _ref 引用</text>

    <rect x="980" y="340" width="200" height="90" rx="14" fill="#101a2e" stroke="#3b4a68" stroke-width="2.5"/>
    <text x="1080" y="380" text-anchor="middle" font-size="22" font-weight="700" fill="#F8FAFC">数据库等</text>
    <text x="1080" y="408" text-anchor="middle" font-size="15" fill="#9FB3D1">用真实密钥连接</text>

    <g stroke="#22D3EE" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <line x1="360" y1="118" x2="204" y2="118"/>
      <line x1="200" y1="152" x2="356" y2="152"/>
      <line x1="470" y1="180" x2="470" y2="336"/>
      <polyline points="580,385 760,385 760,304"/>
      <polyline points="760,210 760,135 976,135"/>
      <polyline points="860,255 930,255 930,385 976,385"/>
    </g>

    <g font-size="15" fill="#E2E8F0">
      <text x="280" y="108" text-anchor="middle">① AppRole 登录</text>
      <text x="280" y="174" text-anchor="middle">② token + 密钥</text>
      <text x="482" y="255">③ 渲染密钥文件</text>
      <text x="600" y="375">④ 读取密钥</text>
      <text x="776" y="102">⑤ 用 Nacos 密码</text>
      <text x="776" y="124">读取 api.yaml</text>
      <text x="1080" y="458" text-anchor="middle">⑥ 替换 _ref 后连接</text>
    </g>
  </g>
</svg>
