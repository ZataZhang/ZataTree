<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title description">
  <title id="title">生产配置迁移分别验证四个边界</title>
  <desc id="description">冻结旧配置并精确比对，用实际发布链路预检注入，在独立卷恢复数据库和 OpenBao，最后通过真实生产页面验证登录与业务调用。临时回滚材料按约定清理，永久凭据和解封材料持续保管。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#9FB3D1"/></marker></defs>
  <rect width="1200" height="470" rx="20" fill="#0B1220"/>
  <g font-family="sans-serif">
    <text x="40" y="61" fill="#F8FAFC" font-size="32" font-weight="700">生产配置迁移，分别验证四个边界</text>
    <text x="40" y="97" fill="#9FB3D1" font-size="19">顺序示意 · 每一步保留可核对的结果，流程图不替代实际验收</text>
    <g fill="#15243A" stroke="#719CD5" stroke-width="2">
      <rect x="35" y="150" width="260" height="155" rx="16"/>
      <rect x="325" y="150" width="260" height="155" rx="16"/>
      <rect x="615" y="150" width="260" height="155" rx="16"/>
      <rect x="905" y="150" width="260" height="155" rx="16"/>
    </g>
    <g fill="#9FB3D1" font-size="18" font-weight="700">
      <text x="57" y="181">01 · 冻结与比对</text><text x="347" y="181">02 · 实际注入预检</text>
      <text x="637" y="181">03 · 隔离恢复</text><text x="927" y="181">04 · 真实生产入口</text>
    </g>
    <g fill="#F8FAFC" font-size="24" font-weight="700">
      <text x="57" y="221">保持现有业务行为</text><text x="347" y="221">检查最终容器值</text>
      <text x="637" y="221">恢复后登录读回</text><text x="927" y="221">登录并完成调用</text>
    </g>
    <g fill="#CDD8E7" font-size="18">
      <text x="57" y="257">原始密钥、空值、覆盖关系</text><text x="57" y="284">镜像、代码与发布配置</text>
      <text x="347" y="257">平台序列化与 Compose</text><text x="347" y="284">不挂载生产数据卷</text>
      <text x="637" y="257">独立数据库与 Raft 卷</text><text x="637" y="284">原始解封材料与数据核对</text>
      <text x="927" y="257">真实账号和应用页面</text><text x="927" y="284">确认新配置来源生效</text>
    </g>
    <g stroke="#9FB3D1" stroke-width="2" marker-end="url(#arrow)"><path d="M299 228H317"/><path d="M589 228H607"/><path d="M879 228H897"/></g>
    <rect x="35" y="350" width="1130" height="80" rx="14" fill="#10332F" stroke="#5EC4B1"/>
    <text x="57" y="381" fill="#96E5D7" font-size="21" font-weight="700">按约定收尾</text>
    <text x="57" y="412" fill="#E2E8F0" font-size="19">验证完成后清理临时回滚副本；日常凭据、解封材料与必要的当前配置备份持续保管。</text>
  </g>
</svg>
