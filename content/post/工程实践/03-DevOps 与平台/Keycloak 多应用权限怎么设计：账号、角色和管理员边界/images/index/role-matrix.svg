<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Alice、Bob 和 Carol 在 CRM、知识库和运营后台中具有互不相同的角色">
  <rect width="1200" height="500" rx="24" fill="#F8FAFC"/>
  <text x="48" y="58" fill="#0F172A" font-family="sans-serif" font-size="30" font-weight="700">同一个人，在不同应用里可以有不同身份</text>
  <text x="48" y="90" fill="#475569" font-family="sans-serif" font-size="17">Keycloak 统一用户登录；每个应用分别判断自己的 Client 角色</text>

  <rect x="80" y="130" width="1040" height="276" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M80 146a16 16 0 0 1 16-16h1008a16 16 0 0 1 16 16v54H80z" fill="#173B70"/>
  <g font-family="sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="220" y="169">用户</text><text x="475" y="169">CRM</text><text x="730" y="169">知识库</text><text x="985" y="169">运营后台</text>
  </g>
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="350" y1="130" x2="350" y2="406"/><line x1="602" y1="130" x2="602" y2="406"/><line x1="858" y1="130" x2="858" y2="406"/>
    <line x1="80" y1="200" x2="1120" y2="200"/><line x1="80" y1="268" x2="1120" y2="268"/><line x1="80" y1="336" x2="1120" y2="336"/>
  </g>
  <g font-family="sans-serif" font-size="18" text-anchor="middle">
    <text x="220" y="243" fill="#0F172A" font-weight="700">Alice</text>
    <text x="475" y="243" fill="#115E59" font-weight="700">user</text>
    <text x="730" y="243" fill="#92400E" font-weight="700">admin</text>
    <text x="985" y="243" fill="#0369A1" font-weight="700">viewer</text>

    <text x="220" y="311" fill="#0F172A" font-weight="700">Bob</text>
    <text x="475" y="311" fill="#92400E" font-weight="700">admin</text>
    <text x="730" y="311" fill="#115E59" font-weight="700">user</text>
    <text x="985" y="311" fill="#92400E" font-weight="700">admin</text>

    <text x="220" y="379" fill="#0F172A" font-weight="700">Carol</text>
    <text x="475" y="379" fill="#115E59" font-weight="700">user</text>
    <text x="730" y="379" fill="#64748B">无访问角色</text>
    <text x="985" y="379" fill="#0369A1" font-weight="700">viewer</text>
  </g>

  <rect x="80" y="430" width="1040" height="42" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="104" y="457" fill="#9A3412" font-family="sans-serif" font-size="16" font-weight="700">“CRM 管理员”只在 CRM 的授权检查中有意义，不会自动变成其他应用的管理员。</text>
</svg>
