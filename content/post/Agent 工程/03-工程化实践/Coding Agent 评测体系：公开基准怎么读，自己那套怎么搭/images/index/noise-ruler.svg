<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="sans-serif">
  <defs>
    <pattern id="dots2" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E2A40"/>
    </pattern>
  </defs>

  <rect width="900" height="330" fill="#0B1220"/>
  <rect width="900" height="330" fill="url(#dots2)"/>

  <text x="46" y="38" fill="#F8FAFC" font-size="19" font-weight="600">噪声，和榜单差距是同一个量级</text>
  <text x="46" y="60" fill="#8FA6C4" font-size="13">单位：个百分点（成功率的绝对差）</text>

  <!-- 横轴刻度 -->
  <g stroke="#2A3A55" stroke-width="1">
    <line x1="300" y1="80" x2="300" y2="296"/>
    <line x1="390" y1="80" x2="390" y2="296"/>
    <line x1="480" y1="80" x2="480" y2="296"/>
    <line x1="570" y1="80" x2="570" y2="296"/>
    <line x1="660" y1="80" x2="660" y2="296"/>
    <line x1="750" y1="80" x2="750" y2="296"/>
    <line x1="840" y1="80" x2="840" y2="296"/>
  </g>
  <g fill="#5B6B85" font-size="11" text-anchor="middle">
    <text x="300" y="312">0</text>
    <text x="390" y="312">5</text>
    <text x="480" y="312">10</text>
    <text x="570" y="312">15</text>
    <text x="660" y="312">20</text>
  </g>

  <!-- 条1: 二项置信区间 1~2 -->
  <text x="292" y="98" fill="#9FB3D1" font-size="13" text-anchor="end">二项分布置信区间（500 题 × 单次）</text>
  <rect x="300" y="84" width="36" height="20" rx="4" fill="#3E5878"/>
  <text x="344" y="99" fill="#8FA6C4" font-size="12">1~2 分</text>

  <!-- 条2: 榜单前列差距 -->
  <text x="292" y="140" fill="#9FB3D1" font-size="13" text-anchor="end">榜单前列的名次差距</text>
  <rect x="300" y="126" width="54" height="20" rx="4" fill="#5B87BF"/>
  <text x="362" y="141" fill="#8FA6C4" font-size="12">0.6~3 分</text>

  <!-- 条3: 基础设施 -->
  <text x="292" y="182" fill="#9FB3D1" font-size="13" text-anchor="end">只改容器资源配置（Anthropic 实测）</text>
  <rect x="300" y="168" width="108" height="20" rx="4" fill="#B58A5B"/>
  <text x="416" y="183" fill="#8FA6C4" font-size="12">6 分（p&lt;0.01）</text>

  <!-- 条4: 脚手架 -->
  <text x="292" y="224" fill="#9FB3D1" font-size="13" text-anchor="end">只换脚手架，不动权重</text>
  <rect x="300" y="210" width="180" height="20" rx="4" fill="#C06B6B"/>
  <text x="488" y="225" fill="#8FA6C4" font-size="12">10~20 分</text>

  <!-- 分隔线 -->
  <line x1="46" y1="252" x2="854" y2="252" stroke="#22304A" stroke-dasharray="5 5"/>

  <text x="46" y="278" fill="#F8FAFC" font-size="14">当你要比较的两个数字差 2 分，</text>
  <text x="248" y="278" fill="#C06B6B" font-size="14" font-weight="600">而测量本身的噪声有 6~20 分 —— 排序的对象是噪声。</text>
</svg>
