<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="none" stroke="#83a9e5"/></marker></defs><rect width="1200" height="460" rx="20" fill="#0b1220"/><text x="60" y="64" fill="#f8fafc" font-family="sans-serif" font-size="30">四个故障域：先找到状态由谁掌握</text><rect x="60" y="125" width="240" height="115" rx="14" fill="#17243b" stroke="#5b87bf" stroke-width="2"/><text x="180.0" y="168" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="24">Agent 节点</text><text x="180.0" y="204" text-anchor="middle" fill="#a9bfdc" font-family="sans-serif" font-size="19">产物与执行记录</text><rect x="340" y="125" width="240" height="115" rx="14" fill="#17243b" stroke="#5b87bf" stroke-width="2"/><text x="460.0" y="168" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="24">外部操作</text><text x="460.0" y="204" text-anchor="middle" fill="#a9bfdc" font-family="sans-serif" font-size="19">远端执行结果</text><rect x="620" y="125" width="240" height="115" rx="14" fill="#17243b" stroke="#5b87bf" stroke-width="2"/><text x="740.0" y="168" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="24">传输连接</text><text x="740.0" y="204" text-anchor="middle" fill="#a9bfdc" font-family="sans-serif" font-size="19">原任务 ID 与状态</text><rect x="900" y="125" width="240" height="115" rx="14" fill="#17243b" stroke="#5b87bf" stroke-width="2"/><text x="1020.0" y="168" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="24">编排与存储</text><text x="1020.0" y="204" text-anchor="middle" fill="#a9bfdc" font-family="sans-serif" font-size="19">持久化恢复依据</text><text x="60" y="416" fill="#a9bfdc" font-family="sans-serif" font-size="22">节点超时可能已有副作用；连接断开不代表远端任务停止。</text></svg>