<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="none" stroke="#83a9e5"/></marker></defs><rect width="1200" height="460" rx="20" fill="#0b1220"/><text x="60" y="64" fill="#f8fafc" font-family="sans-serif" font-size="30">写操作响应丢失：保留原操作身份</text><path d="M290 200 L380 160" stroke="#83a9e5" stroke-width="3" marker-end="url(#a)"/><path d="M290 235 L380 290" stroke="#83a9e5" stroke-width="3" marker-end="url(#a)"/><path d="M710 155 L810 155" stroke="#83a9e5" stroke-width="3" marker-end="url(#a)"/><path d="M710 300 L810 300" stroke="#83a9e5" stroke-width="3" marker-end="url(#a)"/><rect x="50" y="175" width="240" height="110" rx="14" fill="#17243b" stroke="#5b87bf" stroke-width="2"/><text x="170.0" y="218" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="24">结果未知</text><text x="170.0" y="254" text-anchor="middle" fill="#a9bfdc" font-family="sans-serif" font-size="19">保留操作 ID</text><rect x="380" y="100" width="330" height="110" rx="14" fill="#17243b" stroke="#5b87bf" stroke-width="2"/><text x="545.0" y="143" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="24">服务端支持幂等</text><text x="545.0" y="179" text-anchor="middle" fill="#a9bfdc" font-family="sans-serif" font-size="19">按契约复用原键</text><rect x="380" y="245" width="330" height="110" rx="14" fill="#17243b" stroke="#5b87bf" stroke-width="2"/><text x="545.0" y="288" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="24">查询远端结果</text><text x="545.0" y="324" text-anchor="middle" fill="#a9bfdc" font-family="sans-serif" font-size="19">按业务键或唯一标记</text><rect x="810" y="100" width="330" height="110" rx="14" fill="#17243b" stroke="#5b87bf" stroke-width="2"/><text x="975.0" y="143" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="24">确认结果</text><text x="975.0" y="179" text-anchor="middle" fill="#a9bfdc" font-family="sans-serif" font-size="19">保存远端对象 ID</text><rect x="810" y="245" width="330" height="110" rx="14" fill="#17243b" stroke="#5b87bf" stroke-width="2"/><text x="975.0" y="288" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="24">证据不足</text><text x="975.0" y="324" text-anchor="middle" fill="#a9bfdc" font-family="sans-serif" font-size="19">挂起，继续对账或升级</text><text x="60" y="416" fill="#a9bfdc" font-family="sans-serif" font-size="22">查不到 ≠ 没执行；先查后写仍有并发与可见性窗口。</text></svg>