<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Agent 流程中断：四个故障域与结果未知">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#26324a"/></pattern>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C9CF5"/></marker>
  </defs>
  <rect width="1200" height="400" fill="#0B1220"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <text x="60" y="84" font-family="sans-serif" font-size="40" font-weight="700" fill="#E6EBFF">Agent 流程中断了怎么办</text>
  <text x="60" y="124" font-family="sans-serif" font-size="22" fill="#9FB0D8">先分清谁断的，再问做完没有</text>
  <g font-family="sans-serif" font-size="22" fill="#E6EBFF" text-anchor="middle">
    <rect x="60" y="190" width="220" height="96" rx="14" fill="#16213a" stroke="#7C9CF5" stroke-width="2"/>
    <text x="170" y="232">Agent 节点</text><text x="170" y="264" font-size="16" fill="#9FB0D8">重跑 = 重新掷骰子</text>
    <rect x="350" y="190" width="220" height="96" rx="14" fill="#16213a" stroke="#7C9CF5" stroke-width="2"/>
    <text x="460" y="232">外部操作</text><text x="460" y="264" font-size="16" fill="#9FB0D8">重跑 = 重复按按钮</text>
    <rect x="640" y="190" width="220" height="96" rx="14" fill="#16213a" stroke="#7C9CF5" stroke-width="2"/>
    <text x="750" y="232">传输连接</text><text x="750" y="264" font-size="16" fill="#9FB0D8">断线 ≠ 对端停了</text>
    <rect x="930" y="190" width="220" height="96" rx="14" fill="#16213a" stroke="#7C9CF5" stroke-width="2"/>
    <text x="1040" y="232">编排与状态</text><text x="1040" y="264" font-size="16" fill="#9FB0D8">决定能不能从中间续</text>
  </g>
  <g stroke="#7C9CF5" stroke-width="2" marker-end="url(#arr)"><line x1="282" y1="238" x2="346" y2="238"/><line x1="572" y1="238" x2="636" y2="238"/><line x1="862" y1="238" x2="926" y2="238"/></g>
  <rect x="350" y="316" width="510" height="44" rx="22" fill="none" stroke="#F5A97C" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="605" y="345" font-family="sans-serif" font-size="20" fill="#F5A97C" text-anchor="middle">请求发出、没收到响应：结果未知，先对账再重试</text>
</svg>
