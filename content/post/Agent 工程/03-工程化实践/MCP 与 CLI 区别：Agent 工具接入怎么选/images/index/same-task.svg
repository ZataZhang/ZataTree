<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Agent 处理同一个 Issue 查询时的 CLI 与 MCP 调用流程"><rect width="1200" height="480" rx="24" fill="#F8FAFC"/><text x="52" y="56" font-family="sans-serif" font-size="27" font-weight="700" fill="#0F172A">同一个请求：查未关闭 Issue</text><rect x="48" y="82" width="1104" height="64" rx="14" fill="#E9EEF5"/><text x="600" y="121" text-anchor="middle" font-family="sans-serif" font-size="19">“找出 owner/repo 里还没关闭的 Issue，返回编号、标题和链接”</text><rect x="48" y="170" width="1104" height="118" rx="18" fill="#EEF4FB" stroke="#B8CAE1" stroke-width="2"/><text x="74" y="204" font-family="sans-serif" font-size="18" font-weight="700" fill="#28527A">CLI</text><rect x="134" y="216" width="830" height="48" rx="10" fill="white" stroke="#AFC2D8"/><text x="158" y="246" font-family="monospace" font-size="16">gh issue list --repo owner/repo --state open --json number,title,url</text><path d="M980 240h44m-12-8 12 8-12 8" fill="none" stroke="#477AAE" stroke-width="3"/><rect x="1034" y="212" width="94" height="56" rx="10" fill="#DCEAF7"/><text x="1081" y="237" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700">JSON</text><text x="1081" y="255" text-anchor="middle" font-family="sans-serif" font-size="12">stdout</text><rect x="48" y="312" width="1104" height="126" rx="18" fill="#F2F0FC" stroke="#C9C2EA" stroke-width="2"/><text x="74" y="346" font-family="sans-serif" font-size="18" font-weight="700" fill="#5B4B8A">MCP</text><rect x="134" y="358" width="270" height="52" rx="10" fill="white" stroke="#BDB4DE"/><text x="269" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700">Client 发现工具定义</text><text x="269" y="399" text-anchor="middle" font-family="monospace" font-size="12">tools/list → list_issues(schema)</text><path d="M414 384h38m-12-8 12 8-12 8" fill="none" stroke="#7867B1" stroke-width="3"/><rect x="462" y="358" width="316" height="52" rx="10" fill="white" stroke="#BDB4DE"/><text x="620" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700">按 schema 传入结构化参数</text><text x="620" y="399" text-anchor="middle" font-family="monospace" font-size="12">tools/call(repository, state, fields)</text><path d="M788 384h38m-12-8 12 8-12 8" fill="none" stroke="#7867B1" stroke-width="3"/><rect x="836" y="358" width="292" height="52" rx="10" fill="#E8E4F6"/><text x="982" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700">Server 返回结果内容块</text><text x="982" y="399" text-anchor="middle" font-family="sans-serif" font-size="12">宿主整理后交给模型</text></svg>
