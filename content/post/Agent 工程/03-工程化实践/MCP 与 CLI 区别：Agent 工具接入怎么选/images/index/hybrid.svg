<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="通过共享业务服务同时提供 CLI 和 MCP"><rect width="1200" height="420" rx="24" fill="#F8FAFC"/><text x="54" y="58" font-family="sans-serif" font-size="27" font-weight="700" fill="#0F172A">一份业务实现，按需提供多个入口</text><rect x="66" y="112" width="240" height="90" rx="16" fill="#EEF4FB" stroke="#AFC2D8" stroke-width="2"/><text x="186" y="148" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">工程师 / 脚本</text><text x="186" y="176" text-anchor="middle" font-family="sans-serif" font-size="15">直接运行命令</text><rect x="66" y="244" width="240" height="90" rx="16" fill="#F2F0FC" stroke="#BDB4DE" stroke-width="2"/><text x="186" y="280" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">Agent Host</text><text x="186" y="308" text-anchor="middle" font-family="sans-serif" font-size="15">连接 MCP Server</text><path d="M318 157h60m-12-8 12 8-12 8M318 289h30v-59h30m-12-8 12 8-12 8" fill="none" stroke="#64748B" stroke-width="3"/><rect x="390" y="130" width="236" height="196" rx="18" fill="white" stroke="#9CAFC4" stroke-width="2"/><text x="508" y="166" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700">入口适配器</text><rect x="416" y="186" width="184" height="48" rx="10" fill="#DCEAF7"/><text x="508" y="216" text-anchor="middle" font-family="sans-serif" font-size="16">CLI 参数转换</text><rect x="416" y="248" width="184" height="48" rx="10" fill="#E8E4F6"/><text x="508" y="278" text-anchor="middle" font-family="sans-serif" font-size="16">MCP schema 映射</text><path d="M638 230h62m-12-8 12 8-12 8" fill="none" stroke="#475569" stroke-width="3"/><rect x="712" y="128" width="258" height="204" rx="18" fill="#EAF5F2" stroke="#7BB8A9" stroke-width="2"/><text x="841" y="165" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#174E47">共享应用服务</text><text x="841" y="198" text-anchor="middle" font-family="sans-serif" font-size="15">业务规则 · 校验 · 幂等</text><text x="841" y="228" text-anchor="middle" font-family="sans-serif" font-size="15">身份授权 · 审计记录</text><text x="841" y="258" text-anchor="middle" font-family="sans-serif" font-size="15">错误语义 · 结果边界</text><text x="841" y="300" text-anchor="middle" font-family="sans-serif" font-size="13">同一份业务事实</text><path d="M982 230h56m-12-8 12 8-12 8" fill="none" stroke="#475569" stroke-width="3"/><rect x="1050" y="158" width="100" height="144" rx="16" fill="#FFF7E8" stroke="#E7C982" stroke-width="2"/><text x="1100" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700">API /</text><text x="1100" y="220" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700">数据库</text><text x="1100" y="260" text-anchor="middle" font-family="sans-serif" font-size="13">外部系统</text><text x="600" y="386" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">适配器负责协议转换，应用服务负责动作本身；不要在两个入口复制业务规则。</text></svg>
