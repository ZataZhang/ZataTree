<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="MCP 与 CLI 的 Agent 工具选型流程"><rect width="1200" height="500" rx="24" fill="#F8FAFC"/><text x="52" y="56" font-family="sans-serif" font-size="27" font-weight="700" fill="#0F172A">按调用环境与复用范围选入口</text><rect x="334" y="88" width="532" height="68" rx="16" fill="#E9EEF5" stroke="#C7D1DD" stroke-width="2"/><text x="600" y="118" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700">同一套能力需要接给多个 Agent Host 吗？</text><text x="600" y="141" text-anchor="middle" font-family="sans-serif" font-size="14">或需要远程、可发现的工具与上下文？</text><path d="M452 162v42H282m0 0 12-8m-12 8 12 8M748 162v42h170m0 0-12-8m12 8-12 8" fill="none" stroke="#64748B" stroke-width="3"/><text x="350" y="193" font-family="sans-serif" font-size="14" font-weight="700" fill="#5B4B8A">是</text><text x="838" y="193" font-family="sans-serif" font-size="14" font-weight="700" fill="#28527A">否</text><rect x="76" y="216" width="412" height="108" rx="16" fill="#F2F0FC" stroke="#BDB4DE" stroke-width="2"/><text x="282" y="253" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#4B3D79">优先考虑 MCP</text><text x="282" y="282" text-anchor="middle" font-family="sans-serif" font-size="15">多个宿主共享工具定义与授权入口</text><text x="282" y="305" text-anchor="middle" font-family="sans-serif" font-size="15">或需要提供 Resources 等上下文</text><rect x="712" y="216" width="412" height="108" rx="16" fill="#EEF4FB" stroke="#AFC2D8" stroke-width="2"/><text x="918" y="253" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#28527A">检查 CLI 与 shell 条件</text><text x="918" y="282" text-anchor="middle" font-family="sans-serif" font-size="15">已有可靠 CLI，且 Host 能受控运行？</text><text x="918" y="305" text-anchor="middle" font-family="sans-serif" font-size="15">任务是否天然是终端或脚本工作流？</text><path d="M918 330v40H770m0 0 12-8m-12 8 12 8M918 370h140v32m0 0-8-12m8 12 8-12" fill="none" stroke="#64748B" stroke-width="3"/><text x="836" y="359" font-family="sans-serif" font-size="14" font-weight="700" fill="#28527A">是</text><text x="1032" y="359" font-family="sans-serif" font-size="14" font-weight="700" fill="#475569">否</text><rect x="570" y="382" width="328" height="70" rx="16" fill="#DCEAF7"/><text x="734" y="412" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">先用 CLI</text><text x="734" y="435" text-anchor="middle" font-family="sans-serif" font-size="14">明确机器输出、权限和超时</text><rect x="922" y="406" width="226" height="58" rx="14" fill="#FFF7E8" stroke="#E7C982" stroke-width="2"/><text x="1035" y="432" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700">建窄 API / MCP 工具</text><text x="1035" y="451" text-anchor="middle" font-family="sans-serif" font-size="12">避免开放全权限 shell</text><text x="282" y="374" text-anchor="middle" font-family="sans-serif" font-size="14">人和 Agent 都要用：</text><text x="282" y="397" text-anchor="middle" font-family="sans-serif" font-size="14">共享业务层，提供双入口</text><path d="M282 328v20m-7-10 7 10 7-10" fill="none" stroke="#7867B1" stroke-width="3"/></svg>
