<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="决策审计核心检查事件链示意：plan_created、check_started、check_finished 和 verdict_issued；检查尝试按 check_execution_id 配对，决策失效追加 decision_invalidated。固定门禁、人审与动作回执是附加事件">
  <rect width="1200" height="470" rx="24" fill="#0B1220"/>
  <text x="60" y="68" fill="#F8FAFC" font-family="sans-serif" font-size="34" font-weight="700">核心检查事件链（简化状态机）</text>
  <g font-family="sans-serif">
    <rect x="70" y="150" width="240" height="100" rx="18" fill="#132B2A" stroke="#52C3B1" stroke-width="2"/>
    <text x="94" y="190" fill="#F8FAFC" font-size="21" font-weight="700">plan_created</text>
    <text x="94" y="222" fill="#9FB3D1" font-size="15">planner，决策的起点</text>

    <rect x="360" y="150" width="240" height="100" rx="18" fill="#17263D" stroke="#5B87BF" stroke-width="2"/>
    <text x="384" y="190" fill="#F8FAFC" font-size="21" font-weight="700">check_started</text>
    <text x="384" y="222" fill="#9FB3D1" font-size="15">executor，检查开始</text>

    <rect x="650" y="150" width="240" height="100" rx="18" fill="#17263D" stroke="#5B87BF" stroke-width="2"/>
    <text x="674" y="190" fill="#F8FAFC" font-size="21" font-weight="700">check_finished</text>
    <text x="674" y="222" fill="#9FB3D1" font-size="15">executor，写入结果与证据</text>

    <rect x="940" y="150" width="220" height="100" rx="18" fill="#132B2A" stroke="#E9B96E" stroke-width="2"/>
    <text x="964" y="190" fill="#F8FAFC" font-size="21" font-weight="700">verdict_issued</text>
    <text x="964" y="222" fill="#9FB3D1" font-size="15">verifier，裁决与升级</text>

    <path d="M480 150v-30h290v30" stroke="#52C3B1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M759 136l11 14 11-14" stroke="#52C3B1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="625" y="104" fill="#9FB3D1" font-size="16" text-anchor="middle">每个 selected 项各一对</text>

    <path d="M310 200h34" stroke="#52C3B1" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M338 192l14 8-14 8" stroke="#52C3B1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M600 200h34" stroke="#52C3B1" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M628 192l14 8-14 8" stroke="#52C3B1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M890 200h34" stroke="#52C3B1" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M918 192l14 8-14 8" stroke="#52C3B1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <rect x="800" y="330" width="350" height="90" rx="18" fill="#17263D" stroke="#A78BFA" stroke-width="2"/>
    <text x="824" y="368" fill="#F8FAFC" font-size="21" font-weight="700">decision_invalidated</text>
    <text x="824" y="396" fill="#9FB3D1" font-size="15">版本或策略变化时追加</text>
    <path d="M1050 250v66" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" fill="none"/>
    <path d="M1039 308l11 14 11-14" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <text x="70" y="356" fill="#F8FAFC" font-size="18" font-weight="700">简化图省略的附加事件</text>
    <text x="70" y="388" fill="#9FB3D1" font-size="16">gate_evaluated、human_review_requested / resolved</text>
    <text x="70" y="414" fill="#9FB3D1" font-size="16">action_committed 记录执行回执，不等同于 verdict</text>
  </g>
  <text x="60" y="446" fill="#9FB3D1" font-family="sans-serif" font-size="17">每次检查重试使用新的 check_execution_id；追加式存储不改写旧裁决，失效时追加 decision_invalidated。</text>
</svg>
