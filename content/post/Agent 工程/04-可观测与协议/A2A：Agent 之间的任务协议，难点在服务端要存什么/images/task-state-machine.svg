<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#1a1a2e"/><stop offset="100%" style="stop-color:#16213e"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#cbd5e0"/></marker>
  </defs>
  <rect width="900" height="440" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="60" rx="16" fill="#0f0f23"/>
  <rect x="0" y="40" width="900" height="20" fill="#0f0f23"/>
  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">A2A Task 的状态：终态不再收消息</text>

  <rect x="40" y="190" width="140" height="56" rx="12" fill="#4facfe" filter="url(#shadow)"/>
  <text x="110" y="224" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">submitted</text>
  <rect x="270" y="190" width="140" height="56" rx="12" fill="#667eea" filter="url(#shadow)"/>
  <text x="340" y="224" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">working</text>

  <rect x="270" y="80" width="140" height="56" rx="12" fill="#2d3a5c" stroke="#f6ad55" stroke-width="2"/>
  <text x="340" y="105" text-anchor="middle" fill="#f6ad55" font-size="14" font-weight="bold">input-required</text>
  <text x="340" y="124" text-anchor="middle" fill="#a0aec0" font-size="11">中断态</text>
  <rect x="270" y="310" width="140" height="56" rx="12" fill="#2d3a5c" stroke="#f6ad55" stroke-width="2"/>
  <text x="340" y="335" text-anchor="middle" fill="#f6ad55" font-size="14" font-weight="bold">auth-required</text>
  <text x="340" y="354" text-anchor="middle" fill="#a0aec0" font-size="11">中断态</text>

  <rect x="620" y="70" width="240" height="300" rx="14" fill="none" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="740" y="96" text-anchor="middle" fill="#a0aec0" font-size="13">终态：不能再接收消息</text>
  <rect x="660" y="114" width="160" height="46" rx="10" fill="#38a169"/>
  <text x="740" y="143" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">completed</text>
  <rect x="660" y="174" width="160" height="46" rx="10" fill="#e53e3e"/>
  <text x="740" y="203" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">failed</text>
  <rect x="660" y="234" width="160" height="46" rx="10" fill="#718096"/>
  <text x="740" y="263" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">canceled</text>
  <rect x="660" y="294" width="160" height="46" rx="10" fill="#805ad5"/>
  <text x="740" y="323" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">rejected</text>

  <line x1="180" y1="218" x2="268" y2="218" stroke="#cbd5e0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="188" x2="330" y2="138" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="138" x2="350" y2="188" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="248" x2="330" y2="308" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="308" x2="350" y2="248" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="205" x2="618" y2="140" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="215" x2="618" y2="200" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="225" x2="618" y2="260" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="450" y="415" text-anchor="middle" fill="#a0aec0" font-size="12">示意图，只表达状态分类，具体转移以规范为准；中断态用同一 taskId 与 contextId 发新消息继续</text>
</svg>
