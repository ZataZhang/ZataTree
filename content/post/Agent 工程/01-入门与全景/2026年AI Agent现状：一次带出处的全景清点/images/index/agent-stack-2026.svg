<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" role="img" aria-label="2026 年 Agent 技术栈四层示意图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101B31"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.1" cy="1.1" r="1.1" fill="#1C2B45"/>
    </pattern>
  </defs>

  <rect width="820" height="480" fill="url(#bg)"/>
  <rect width="820" height="480" fill="url(#dots)"/>

  <text x="24" y="36" font-family="sans-serif" font-size="21" font-weight="700" fill="#F8FAFC">四层栈：谁在改这层，改得多快</text>
  <text x="24" y="58" font-family="sans-serif" font-size="12" fill="#9FB3D1">抓取时点 2026-09-28 · 自上而下，从「标准真空」到「基金会接管」</text>

  <!-- 经验层 -->
  <rect x="24" y="74" width="772" height="72" rx="9" fill="#152238" stroke="#22D3EE" stroke-width="1.6"/>
  <text x="42" y="102" font-family="sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">经验层 · 记忆 / 技能文件</text>
  <text x="42" y="126" font-family="monospace" font-size="11.5" fill="#9FB3D1">SKILL.md + progressive disclosure · playbook · Mem0 / Zep · ACE</text>
  <text x="778" y="102" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="700" fill="#5EEAD4">还没有标准</text>
  <text x="778" y="126" text-anchor="end" font-family="sans-serif" font-size="11.5" fill="#9FB3D1">我们能自己定规则的一层</text>

  <!-- 编排层 -->
  <rect x="24" y="158" width="772" height="72" rx="9" fill="#141F33" stroke="#7C9CF5" stroke-width="1.4"/>
  <text x="42" y="186" font-family="sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">编排层 · 图 / 工作流</text>
  <text x="42" y="210" font-family="monospace" font-size="11.5" fill="#9FB3D1">LangGraph · CrewAI · ADK · MS Agent Framework · AutoGen 已维护</text>
  <text x="778" y="186" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="700" fill="#A78BFA">商品化</text>
  <text x="778" y="210" text-anchor="end" font-family="sans-serif" font-size="11.5" fill="#9FB3D1">单循环 + 子代理成默认</text>

  <!-- 外壳与运行时 -->
  <rect x="24" y="242" width="772" height="72" rx="9" fill="#152238" stroke="#A78BFA" stroke-width="1.6"/>
  <text x="42" y="270" font-family="sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">外壳与运行时 · Agent 跑在谁的机器上</text>
  <text x="42" y="294" font-family="monospace" font-size="11.5" fill="#9FB3D1">Claude Code · Codex · OpenClaw · Hermes · AgentCore · Agents API</text>
  <text x="778" y="270" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="700" fill="#C4B5FD">发版最密</text>
  <text x="778" y="294" text-anchor="end" font-family="sans-serif" font-size="11.5" fill="#9FB3D1">成本随外壳浮动数倍</text>

  <!-- 协议层 -->
  <rect x="24" y="326" width="772" height="72" rx="9" fill="#13203A" stroke="#5B87BF" stroke-width="1.6"/>
  <text x="42" y="354" font-family="sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">协议层 · 工具 / Agent 间 / 支付 / 身份</text>
  <text x="42" y="378" font-family="monospace" font-size="11.5" fill="#9FB3D1">MCP 2026-07-28 · A2A v1.0.0 · x402 · Web Bot Auth · AAIF(LF)</text>
  <text x="778" y="354" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="700" fill="#93C5FD">在做减法</text>
  <text x="778" y="378" text-anchor="end" font-family="sans-serif" font-size="11.5" fill="#9FB3D1">身份与权限仍最薄</text>

  <!-- 测量端 -->
  <line x1="24" y1="416" x2="796" y2="416" stroke="#243451" stroke-width="1.2"/>
  <text x="24" y="440" font-family="sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">测量端同时坏了两处</text>
  <text x="160" y="440" font-family="sans-serif" font-size="12.5" fill="#9FB3D1">能力：METR 翻倍 128.7 天，但自陈「16 小时以上测不准」</text>
  <text x="24" y="464" font-family="sans-serif" font-size="12.5" fill="#9FB3D1">落地：57%（从业者自报）vs 18%（开发者抽样）——差在分母，不在模型</text>
</svg>
