<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="ReAct 循环：Thought 与 Action 交错，Observation 把真实结果带回上下文">
<defs>
  <marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#38b6a8"/>
  </marker>
  <marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#5b87bf"/>
  </marker>
</defs>
<rect width="1200" height="430" fill="#0b1220"/>
<text x="40" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#f8fafc">ReAct 循环：想一步，做一步，看结果</text>

<g font-family="sans-serif">
  <rect x="50" y="96" width="170" height="62" rx="12" fill="#0e1730" stroke="#3b4a68" stroke-width="2"/>
  <text x="135" y="134" font-size="21" fill="#e6eefb" text-anchor="middle">任务</text>

  <rect x="510" y="96" width="220" height="62" rx="12" fill="#0e1730" stroke="#38b6a8" stroke-width="2"/>
  <text x="620" y="127" font-size="21" fill="#f8fafc" text-anchor="middle">Thought · 思考</text>
  <text x="620" y="148" font-size="15" fill="#9fb3d1" text-anchor="middle">下一步打算做什么</text>

  <rect x="980" y="96" width="170" height="62" rx="12" fill="#0e1730" stroke="#5b87bf" stroke-width="2"/>
  <text x="1065" y="134" font-size="21" fill="#e6eefb" text-anchor="middle">最终答案</text>

  <rect x="305" y="276" width="230" height="62" rx="12" fill="#0e1730" stroke="#38b6a8" stroke-width="2"/>
  <text x="420" y="307" font-size="21" fill="#f8fafc" text-anchor="middle">Observation · 观察</text>
  <text x="420" y="328" font-size="15" fill="#9fb3d1" text-anchor="middle">真实结果写回上下文</text>

  <rect x="740" y="276" width="200" height="62" rx="12" fill="#0e1730" stroke="#38b6a8" stroke-width="2"/>
  <text x="840" y="307" font-size="21" fill="#f8fafc" text-anchor="middle">Action · 行动</text>
  <text x="840" y="328" font-size="15" fill="#9fb3d1" text-anchor="middle">调用工具，传参数</text>

  <line x1="222" y1="127" x2="504" y2="127" stroke="#5b87bf" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>
  <line x1="732" y1="127" x2="974" y2="127" stroke="#5b87bf" stroke-width="3" stroke-linecap="round" marker-end="url(#a-blue)"/>

  <line x1="702" y1="160" x2="778" y2="272" stroke="#38b6a8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-teal)"/>
  <line x1="736" y1="307" x2="541" y2="307" stroke="#38b6a8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-teal)"/>
  <line x1="528" y1="272" x2="562" y2="160" stroke="#38b6a8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-teal)"/>

  <text x="363" y="116" font-size="16" fill="#64748b" text-anchor="middle">输入任务</text>
  <text x="853" y="116" font-size="16" fill="#64748b" text-anchor="middle">不需要工具就直接作答</text>
  <text x="636" y="242" font-size="20" fill="#38b6a8" text-anchor="middle" letter-spacing="3">循环</text>
</g>

<g font-family="sans-serif">
  <text x="40" y="392" font-size="19" fill="#9fb3d1">推理与行动交错：观察结果成了下一轮思考的输入，模型因此能纠错</text>
  <text x="40" y="418" font-size="16" fill="#64748b">Shunyu Yao et al., 2022 · arXiv:2210.03629 · ALFWorld 绝对成功率 +34 个百分点</text>
</g>
</svg>
