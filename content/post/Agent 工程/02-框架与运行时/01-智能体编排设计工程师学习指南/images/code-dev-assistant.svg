<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#1a1a2e"/><stop offset="100%" style="stop-color:#16213e"/></linearGradient>
    <linearGradient id="pm" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#667eea"/><stop offset="100%" style="stop-color:#764ba2"/></linearGradient>
    <linearGradient id="dev" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#43e97b"/><stop offset="100%" style="stop-color:#38f9d7"/></linearGradient>
    <linearGradient id="test" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4facfe"/><stop offset="100%" style="stop-color:#00f2fe"/></linearGradient>
    <linearGradient id="doc" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f093fb"/><stop offset="100%" style="stop-color:#f5576c"/></linearGradient>
    <linearGradient id="review" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#fa709a"/><stop offset="100%" style="stop-color:#fee140"/></linearGradient>
    <linearGradient id="deploy" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#a855f7"/><stop offset="100%" style="stop-color:#6366f1"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a0aec0"/></marker>
  </defs>

  <rect width="720" height="660" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="720" height="46" rx="16" fill="#0f0f23"/>
  <rect x="0" y="30" width="720" height="16" fill="#0f0f23"/>
  <text x="360" y="30" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">代码开发助手 — 层级编排设计</text>

  <!-- PM Agent -->
  <rect x="210" y="62" width="300" height="50" rx="10" fill="url(#pm)" filter="url(#shadow)"/>
  <text x="360" y="84" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">🏗️ PM Agent</text>
  <text x="360" y="102" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">分析需求 · 拆解任务 · 分配工作</text>

  <line x1="360" y1="112" x2="360" y2="138" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Distribution -->
  <line x1="150" y1="142" x2="570" y2="142" stroke="#718096" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="150" y1="142" x2="150" y2="156" stroke="#718096" stroke-width="1.5"/>
  <line x1="360" y1="142" x2="360" y2="156" stroke="#718096" stroke-width="1.5"/>
  <line x1="570" y1="142" x2="570" y2="156" stroke="#718096" stroke-width="1.5"/>

  <!-- Workers Row 1 -->
  <rect x="75" y="160" width="150" height="75" rx="10" fill="url(#dev)" filter="url(#shadow)" opacity="0.9"/>
  <text x="150" y="188" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="bold">💻 Dev Agent</text>
  <text x="150" y="206" text-anchor="middle" fill="rgba(26,26,46,0.75)" font-size="9">写代码</text>
  <text x="150" y="222" text-anchor="middle" fill="rgba(26,26,46,0.75)" font-size="9">实现业务逻辑</text>

  <rect x="285" y="160" width="150" height="75" rx="10" fill="url(#test)" filter="url(#shadow)" opacity="0.9"/>
  <text x="360" y="188" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="bold">🧪 Test Agent</text>
  <text x="360" y="206" text-anchor="middle" fill="rgba(26,26,46,0.75)" font-size="9">写测试</text>
  <text x="360" y="222" text-anchor="middle" fill="rgba(26,26,46,0.75)" font-size="9">单元测试 + 集成测试</text>

  <rect x="495" y="160" width="150" height="75" rx="10" fill="url(#doc)" filter="url(#shadow)" opacity="0.9"/>
  <text x="570" y="188" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">📝 Doc Agent</text>
  <text x="570" y="206" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="9">写文档</text>
  <text x="570" y="222" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="9">API 文档 + 说明</text>

  <!-- Collector 1 -->
  <line x1="150" y1="235" x2="150" y2="256" stroke="#a0aec0" stroke-width="1.5"/>
  <line x1="360" y1="235" x2="360" y2="256" stroke="#a0aec0" stroke-width="1.5"/>
  <line x1="570" y1="235" x2="570" y2="256" stroke="#a0aec0" stroke-width="1.5"/>
  <line x1="150" y1="256" x2="570" y2="256" stroke="#718096" stroke-width="1.5" stroke-dasharray="4,3"/>

  <line x1="360" y1="256" x2="360" y2="282" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Review Agent -->
  <rect x="210" y="286" width="300" height="50" rx="10" fill="url(#review)" filter="url(#shadow)" opacity="0.9"/>
  <text x="360" y="308" text-anchor="middle" fill="#1a1a2e" font-size="14" font-weight="bold">🔍 Review Agent</text>
  <text x="360" y="326" text-anchor="middle" fill="rgba(26,26,46,0.75)" font-size="10">Code Review · 整合代码 · 质量把关</text>

  <line x1="360" y1="336" x2="360" y2="362" stroke="#a0aec0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Deploy Agent -->
  <rect x="210" y="366" width="300" height="50" rx="10" fill="url(#deploy)" filter="url(#shadow)"/>
  <text x="360" y="388" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">🚀 Deploy Agent</text>
  <text x="360" y="406" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">提交代码 · 运行 CI/CD · 部署上线</text>

  <!-- Efficiency comparison -->
  <rect x="30" y="440" width="660" height="200" rx="10" fill="#0f0f23" opacity="0.8"/>
  <text x="360" y="465" text-anchor="middle" fill="#a0aec0" font-size="13" font-weight="bold">📊 实际效果对比</text>

  <!-- Bar chart area -->
  <text x="120" y="495" text-anchor="middle" fill="#718096" font-size="10">CRUD API</text>
  <text x="260" y="495" text-anchor="middle" fill="#718096" font-size="10">单元测试</text>
  <text x="400" y="495" text-anchor="middle" fill="#718096" font-size="10">API 文档</text>
  <text x="540" y="495" text-anchor="middle" fill="#718096" font-size="10">Code Review</text>

  <!-- Bar: CRUD API -->
  <rect x="90" y="510" width="60" height="90" rx="3" fill="#2d3748"/>
  <rect x="90" y="592" width="60" height="8" rx="3" fill="#43e97b"/>
  <text x="120" y="505" text-anchor="middle" fill="#a0aec0" font-size="9">2h</text>
  <text x="120" y="605" text-anchor="middle" fill="#43e97b" font-size="9">15m</text>
  <text x="155" y="600" fill="#43e97b" font-size="8" font-weight="bold">8x</text>

  <!-- Bar: Unit Test -->
  <rect x="230" y="522" width="60" height="78" rx="3" fill="#2d3748"/>
  <rect x="230" y="592" width="60" height="8" rx="3" fill="#4facfe"/>
  <text x="260" y="517" text-anchor="middle" fill="#a0aec0" font-size="9">1h</text>
  <text x="260" y="605" text-anchor="middle" fill="#4facfe" font-size="9">5m</text>
  <text x="295" y="600" fill="#4facfe" font-size="8" font-weight="bold">12x</text>

  <!-- Bar: API Doc -->
  <rect x="370" y="534" width="60" height="66" rx="3" fill="#2d3748"/>
  <rect x="370" y="592" width="60" height="8" rx="3" fill="#f093fb"/>
  <text x="400" y="529" text-anchor="middle" fill="#a0aec0" font-size="9">30m</text>
  <text x="400" y="605" text-anchor="middle" fill="#f093fb" font-size="9">3m</text>
  <text x="435" y="600" fill="#f093fb" font-size="8" font-weight="bold">10x</text>

  <!-- Bar: Code Review -->
  <rect x="510" y="555" width="60" height="45" rx="3" fill="#2d3748"/>
  <rect x="510" y="592" width="60" height="8" rx="3" fill="#fa709a"/>
  <text x="540" y="550" text-anchor="middle" fill="#a0aec0" font-size="9">20m</text>
  <text x="540" y="605" text-anchor="middle" fill="#fa709a" font-size="9">10m</text>
  <text x="575" y="600" fill="#fa709a" font-size="8" font-weight="bold">2x</text>

  <rect x="50" y="510" width="22" height="10" rx="2" fill="#2d3748"/>
  <text x="76" y="519" fill="#718096" font-size="7">传统</text>
  <rect x="50" y="525" width="22" height="10" rx="2" fill="url(#dev)"/>
  <text x="76" y="534" fill="#718096" font-size="7">Agent</text>
</svg>
