<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">MASS 三阶段优化流程</title><desc id="desc">从模块级提示词优化，到拓扑搜索，再到全局提示词协同优化。</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#5b87bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#8aa9d5"/></marker></defs><rect width="1200" height="430" rx="24" fill="#0b1220"/><g fill="#26324a" opacity=".6"><circle cx="40" cy="40" r="2"/><circle cx="1160" cy="80" r="2"/><circle cx="800" cy="30" r="2"/><circle cx="360" cy="390" r="2"/></g><text x="60" y="70" fill="#f8fafc" font-family="sans-serif" font-size="27" font-weight="700">MASS 的优化顺序：由局部到全局</text><text x="60" y="105" fill="#9fb3d1" font-family="sans-serif" font-size="16">每个阶段缩小下一阶段的问题范围</text><g stroke="#8aa9d5" stroke-width="3" marker-end="url(#arrow)"><path d="M358 230H420"/><path d="M758 230H820"/></g><g font-family="sans-serif"><rect x="60" y="145" width="300" height="180" rx="18" fill="#101a2e" stroke="#5b87bf" stroke-width="2"/><text x="86" y="184" fill="#7c9cf5" font-size="14" font-weight="700">1PO · BLOCK-LEVEL</text><text x="86" y="222" fill="#f8fafc" font-size="23" font-weight="700">优化局部提示词</text><text x="86" y="258" fill="#9fb3d1" font-size="16">Predictor、Reflect、Debate 等</text><text x="86" y="285" fill="#9fb3d1" font-size="16">先分别验证模块能否带来增益</text><rect x="450" y="145" width="300" height="180" rx="18" fill="#101a2e" stroke="#a78bfa" stroke-width="2"/><text x="476" y="184" fill="#c4b5fd" font-size="14" font-weight="700">2TO · WORKFLOW-LEVEL</text><text x="476" y="222" fill="#f8fafc" font-size="23" font-weight="700">搜索工作流拓扑</text><text x="476" y="258" fill="#9fb3d1" font-size="16">按模块增量影响筛选候选空间</text><text x="476" y="285" fill="#9fb3d1" font-size="16">在 Agent 数量预算内评估组合</text><rect x="840" y="145" width="300" height="180" rx="18" fill="#101a2e" stroke="#22d3ee" stroke-width="2"/><text x="866" y="184" fill="#67e8f9" font-size="14" font-weight="700">3PO · SYSTEM-LEVEL</text><text x="866" y="222" fill="#f8fafc" font-size="23" font-weight="700">整体协同调优</text><text x="866" y="258" fill="#9fb3d1" font-size="16">固定较优拓扑，联合优化提示词</text><text x="866" y="285" fill="#9fb3d1" font-size="16">让模块适配真实上下游输出</text><text x="60" y="375" fill="#9fb3d1" font-family="sans-serif" font-size="15">核心：先验证构件价值，再优化连接方式，最后适配整个系统。</text></g></svg>