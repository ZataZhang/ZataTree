<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">模型工具调用链</title>
  <desc id="desc">插件注册工具，Agent Loop 把 schema 加到模型请求，模型发起工具调用，执行经过策略管道，结果记录到 Session 后继续运行。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#15233A"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7890B2" opacity=".22"/></pattern></defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/><rect width="1200" height="560" rx="28" fill="url(#grid)"/>
  <text x="60" y="64" fill="#F8FAFC" font-family="sans-serif" font-size="28" font-weight="700">一个工具插件如何进入 Agent 的执行循环</text>
  <text x="60" y="96" fill="#9FB3D1" font-family="sans-serif" font-size="16">工具定义让模型知道“能调用什么”，执行管道决定“调用如何落地”</text>
  <g font-family="sans-serif">
    <rect x="48" y="190" width="205" height="132" rx="16" fill="#172A40" stroke="#5B87BF" stroke-width="2"/><text x="72" y="229" fill="#7DD3FC" font-size="15">插件</text><text x="72" y="263" fill="#F8FAFC" font-size="20" font-weight="700">register tool</text><text x="72" y="292" fill="#A7BCD7" font-size="14">schema + execute</text>
    <path d="M254 255h33" stroke="#82A9D8" stroke-width="3"/><path d="m279 247 12 8-12 8" fill="none" stroke="#82A9D8" stroke-width="3"/>
    <rect x="300" y="190" width="205" height="132" rx="16" fill="#172A40" stroke="#22D3EE" stroke-width="2"/><text x="324" y="229" fill="#67E8F9" font-size="15">Agent Loop</text><text x="324" y="263" fill="#F8FAFC" font-size="20" font-weight="700">assemble request</text><text x="324" y="292" fill="#A7BCD7" font-size="14">工具 schema 进入请求</text>
    <path d="M506 255h33" stroke="#82A9D8" stroke-width="3"/><path d="m531 247 12 8-12 8" fill="none" stroke="#82A9D8" stroke-width="3"/>
    <rect x="552" y="190" width="205" height="132" rx="16" fill="#172A40" stroke="#A78BFA" stroke-width="2"/><text x="576" y="229" fill="#C4B5FD" font-size="15">模型</text><text x="576" y="263" fill="#F8FAFC" font-size="20" font-weight="700">tool call</text><text x="576" y="292" fill="#A7BCD7" font-size="14">返回工具名与参数</text>
    <path d="M758 255h33" stroke="#82A9D8" stroke-width="3"/><path d="m783 247 12 8-12 8" fill="none" stroke="#82A9D8" stroke-width="3"/>
    <rect x="804" y="190" width="205" height="132" rx="16" fill="#172A40" stroke="#FBBF24" stroke-width="2"/><text x="828" y="229" fill="#FDE68A" font-size="15">执行管道</text><text x="828" y="263" fill="#F8FAFC" font-size="19" font-weight="700">pre → execute</text><text x="828" y="292" fill="#A7BCD7" font-size="14">guard / approval / result</text>
    <path d="M1010 255h33" stroke="#82A9D8" stroke-width="3"/><path d="m1035 247 12 8-12 8" fill="none" stroke="#82A9D8" stroke-width="3"/>
    <rect x="1056" y="190" width="96" height="132" rx="16" fill="#172A40" stroke="#F472B6" stroke-width="2"/><text x="1073" y="229" fill="#F9A8D4" font-size="15">Session</text><text x="1073" y="265" fill="#F8FAFC" font-size="17" font-weight="700">log</text><text x="1073" y="292" fill="#A7BCD7" font-size="13">继续请求</text>
  </g>
  <path d="M1104 327v81H403v-82" fill="none" stroke="#6FA8D8" stroke-width="2.5" stroke-dasharray="7 7"/><path d="m395 336 8-12 8 12" fill="none" stroke="#6FA8D8" stroke-width="2.5"/>
  <text x="510" y="397" fill="#A7BCD7" font-family="sans-serif" font-size="16">工具结果回到 Agent Loop，驱动下一次模型请求</text>
  <text x="60" y="486" fill="#A7BCD7" font-family="sans-serif" font-size="15">工具注册与执行是模型可见能力的一种消费者形态；同一套插件系统还可扩展服务、事件和 UI。</text>
</svg>
