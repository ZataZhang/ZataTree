<svg xmlns="http://www.w3.org/2000/svg" width="820" height="530" viewBox="0 0 820 530" role="img" aria-label="Agent 自进化的五个可动部位与开源成熟度">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101B31"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.1" cy="1.1" r="1.1" fill="#1C2B45"/>
    </pattern>
  </defs>

  <rect width="820" height="530" fill="url(#bg)"/>
  <rect width="820" height="530" fill="url(#dots)"/>

  <text x="24" y="34" font-family="sans-serif" font-size="21" font-weight="700" fill="#F8FAFC">自进化的五个可动部位，与它们的开源成熟度</text>
  <text x="24" y="56" font-family="sans-serif" font-size="12" fill="#9FB3D1">成熟度 = 今天能否 pip install 并跑出自己的评测数字 · 数据抓取 2026-09-28</text>

  <!-- rows -->
  <g>
    <!-- 1 上下文/技能 -->
    <rect x="24" y="72" width="772" height="66" rx="9" fill="#152238" stroke="#22D3EE" stroke-width="1.6"/>
    <text x="42" y="98" font-family="sans-serif" font-size="15.5" font-weight="700" fill="#F8FAFC">上下文 · 记忆 / 技能文件</text>
    <text x="42" y="120" font-family="monospace" font-size="11.5" fill="#9FB3D1">gepa · dspy.GEPA · reme-ai · mem0 · graphiti · agentskills</text>
    <rect x="620" y="90" width="120" height="7" rx="3.5" fill="#22334D"/>
    <rect x="620" y="90" width="112" height="7" rx="3.5" fill="#22D3EE"/>
    <text x="620" y="118" font-family="sans-serif" font-size="11.5" fill="#5EEAD4">高 · 当天 push</text>
    <text x="778" y="104" text-anchor="end" font-family="sans-serif" font-size="12" fill="#F8FAFC">能跑</text>

    <!-- 2 结构搜索 -->
    <rect x="24" y="148" width="772" height="66" rx="9" fill="#141F33" stroke="#7C9CF5" stroke-width="1.4"/>
    <text x="42" y="174" font-family="sans-serif" font-size="15.5" font-weight="700" fill="#F8FAFC">系统结构 · 工作流搜索</text>
    <text x="42" y="196" font-family="monospace" font-size="11.5" fill="#9FB3D1">EvoAgentX · AFlow · ADAS · AgentEvolver</text>
    <rect x="620" y="166" width="120" height="7" rx="3.5" fill="#22334D"/>
    <rect x="620" y="166" width="62" height="7" rx="3.5" fill="#7C9CF5"/>
    <text x="620" y="194" font-family="sans-serif" font-size="11.5" fill="#A78BFA">中 · 半数停更</text>
    <text x="778" y="180" text-anchor="end" font-family="sans-serif" font-size="12" fill="#F8FAFC">抄思路</text>

    <!-- 3 程序搜索 -->
    <rect x="24" y="224" width="772" height="66" rx="9" fill="#152238" stroke="#5B87BF" stroke-width="1.4"/>
    <text x="42" y="250" font-family="sans-serif" font-size="15.5" font-weight="700" fill="#F8FAFC">离线程序搜索 · 进化出算子</text>
    <text x="42" y="272" font-family="monospace" font-size="11.5" fill="#9FB3D1">OpenEvolve · ShinkaEvolve · EvoScientist（AlphaEvolve 不开源）</text>
    <rect x="620" y="242" width="120" height="7" rx="3.5" fill="#22334D"/>
    <rect x="620" y="242" width="84" height="7" rx="3.5" fill="#5B87BF"/>
    <text x="620" y="270" font-family="sans-serif" font-size="11.5" fill="#93C5FD">中高 · 活跃</text>
    <text x="778" y="256" text-anchor="end" font-family="sans-serif" font-size="12" fill="#F8FAFC">走评审</text>

    <!-- 4 自我改代码 -->
    <rect x="24" y="300" width="772" height="66" rx="9" fill="#1B1B2A" stroke="#F59E0B" stroke-width="1.4"/>
    <text x="42" y="326" font-family="sans-serif" font-size="15.5" font-weight="700" fill="#F8FAFC">自我修改代码 · DGM 谱系</text>
    <text x="42" y="348" font-family="monospace" font-size="11.5" fill="#9FB3D1">dgm 停在 2025-08 · HyperAgents 非商用 · Gödel Agent / STOP 停摆</text>
    <rect x="620" y="318" width="120" height="7" rx="3.5" fill="#22334D"/>
    <rect x="620" y="318" width="34" height="7" rx="3.5" fill="#F59E0B"/>
    <text x="620" y="346" font-family="sans-serif" font-size="11.5" fill="#FBBF24">低 · 复现昂贵</text>
    <text x="778" y="332" text-anchor="end" font-family="sans-serif" font-size="12" fill="#F8FAFC">仅沙箱</text>

    <!-- 5 权重 -->
    <rect x="24" y="376" width="772" height="66" rx="9" fill="#231725" stroke="#A78BFA" stroke-width="1.4"/>
    <text x="42" y="402" font-family="sans-serif" font-size="15.5" font-weight="700" fill="#F8FAFC">权重 · 自我训练</text>
    <text x="42" y="424" font-family="monospace" font-size="11.5" fill="#9FB3D1">SEAL 停在 2025-08 · RAGEN 诊断坍塌 · verl / slime / OpenRLHF 是底座</text>
    <rect x="620" y="394" width="120" height="7" rx="3.5" fill="#22334D"/>
    <rect x="620" y="394" width="22" height="7" rx="3.5" fill="#C084FC"/>
    <text x="620" y="422" font-family="sans-serif" font-size="11.5" fill="#D8B4FE">基础设施而已</text>
    <text x="778" y="408" text-anchor="end" font-family="sans-serif" font-size="12" fill="#F8FAFC">别指望</text>
  </g>

  <line x1="24" y1="462" x2="796" y2="462" stroke="#243451" stroke-width="1.2"/>
  <text x="24" y="486" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">而 2026 下半年真正的进展不在这五行里：</text>
  <text x="24" y="510" font-family="sans-serif" font-size="12.5" fill="#9FB3D1">它在一道外部准入门——held-out 不回归才 promote（RSEA / PACE / Self-Healing Harness）</text>
  <text x="778" y="510" text-anchor="end" font-family="monospace" font-size="11" fill="#3B5474">zata.cc</text>
</svg>
