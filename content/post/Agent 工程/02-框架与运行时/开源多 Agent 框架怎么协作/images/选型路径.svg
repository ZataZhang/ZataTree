<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
<rect width="1200" height="480" rx="28" fill="#F8FAFC"/>
<text x="64" y="68" fill="#0B1220" font-family="sans-serif" font-size="34" font-weight="700">按主要协作原语选入口</text>
<text x="64" y="108" fill="#475569" font-family="sans-serif" font-size="20">任务可以组合多种模式；下面列的是每条路线最有辨识度的起点</text>
<g font-family="sans-serif">
<rect x="55" y="154" width="260" height="255" rx="20" fill="#EAF1FB" stroke="#5B87BF" stroke-width="2"/>
<circle cx="91" cy="194" r="18" fill="#5B87BF"/><text x="91" y="201" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">1</text>
<text x="121" y="201" fill="#1E3A5F" font-size="23" font-weight="700">显式流程与状态</text>
<text x="80" y="251" fill="#334155" font-size="17">步骤、分支和状态需要可控</text>
<text x="80" y="286" fill="#0B1220" font-size="19" font-weight="700">LangGraph</text>
<text x="80" y="318" fill="#0B1220" font-size="16" font-weight="700">Microsoft Agent Framework</text>
<text x="80" y="354" fill="#475569" font-size="16">Workflow：顺序、并行与条件路由</text>
<rect x="335" y="154" width="260" height="255" rx="20" fill="#E8F7F3" stroke="#0F9D83" stroke-width="2"/>
<circle cx="371" cy="194" r="18" fill="#0F9D83"/><text x="371" y="201" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">2</text>
<text x="401" y="201" fill="#115E59" font-size="23" font-weight="700">角色与任务</text>
<text x="360" y="251" fill="#334155" font-size="17">职责清楚，也希望 Agent 自主协作</text>
<text x="360" y="291" fill="#0B1220" font-size="20" font-weight="700">CrewAI Crew</text>
<text x="360" y="323" fill="#0B1220" font-size="18" font-weight="700">+ Flow</text>
<text x="360" y="354" fill="#475569" font-size="16">Flow 为自主团队加上条件与状态</text>
<rect x="615" y="154" width="260" height="255" rx="20" fill="#F1ECFD" stroke="#8B5CF6" stroke-width="2"/>
<circle cx="651" cy="194" r="18" fill="#8B5CF6"/><text x="651" y="201" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">3</text>
<text x="681" y="201" fill="#4C1D95" font-size="23" font-weight="700">讨论与交接</text>
<text x="640" y="251" fill="#334155" font-size="17">共享上下文，动态决定下一位</text>
<text x="640" y="286" fill="#0B1220" font-size="17" font-weight="700">Microsoft Agent</text>
<text x="640" y="312" fill="#0B1220" font-size="17" font-weight="700">Framework</text>
<text x="640" y="341" fill="#0B1220" font-size="17" font-weight="700">GroupChat / Handoff</text>
<text x="640" y="374" fill="#475569" font-size="16">群聊、选人和显式控制权转移</text>
<rect x="895" y="154" width="250" height="255" rx="20" fill="#FFF5E7" stroke="#D97706" stroke-width="2"/>
<circle cx="931" cy="194" r="18" fill="#D97706"/><text x="931" y="201" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">4</text>
<text x="961" y="201" fill="#92400E" font-size="23" font-weight="700">领域 SOP</text>
<text x="920" y="251" fill="#334155" font-size="17">中间产物和责任顺序很重要</text>
<text x="920" y="291" fill="#0B1220" font-size="20" font-weight="700">MetaGPT</text>
<text x="920" y="323" fill="#475569" font-size="16">按角色流程生成项目产物</text>
<text x="920" y="354" fill="#475569" font-size="16">适合软件团队式协作任务</text>
</g>
<text x="64" y="450" fill="#64748B" font-family="sans-serif" font-size="16">选型时同时确认：上下文共享边界、转交规则、可观察性与终止条件。</text>
</svg>
