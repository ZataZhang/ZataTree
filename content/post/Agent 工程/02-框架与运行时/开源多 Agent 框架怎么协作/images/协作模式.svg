<rect x="646" y="424" width="130" height="60" rx="12" fill="#FFFFFF"/><text x="711" y="450" fill="#0B1220" font-size="17" text-anchor="middle">需求文档</text><text x="711" y="473" fill="#64748B" font-size="14" text-anchor="middle">产品角色</text>
