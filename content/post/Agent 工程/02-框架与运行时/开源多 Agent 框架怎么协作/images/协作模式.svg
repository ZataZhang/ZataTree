<rect x="822" y="282" width="112" height="36" rx="9" fill="#FFFFFF"/><text x="878" y="306" fill="#0B1220" font-size="16" text-anchor="middle">专家 B</text>
<rect x="952" y="282" width="112" height="36" rx="9" fill="#FFFFFF"/><text x="1008" y="306" fill="#0B1220" font-size="16" text-anchor="middle">专家 C</text>
