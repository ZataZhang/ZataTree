<text x="82" y="390" fill="#115E59" font-size="24" font-weight="700">群聊 / 动态交接</text>
<circle cx="170" cy="457" r="35" fill="#FFFFFF" stroke="#0F9D83" stroke-width="2"/><text x="170" y="463" fill="#0B1220" font-size="16" text-anchor="middle">Agent A</text>
<circle cx="322" cy="430" r="35" fill="#FFFFFF" stroke="#0F9D83" stroke-width="2"/><text x="322" y="436" fill="#0B1220" font-size="16" text-anchor="middle">Agent B</text>
<circle cx="458" cy="475" r="35" fill="#FFFFFF" stroke="#0F9D83" stroke-width="2"/><text x="458" y="481" fill="#0B1220" font-size="16" text-anchor="middle">Agent C</text>
