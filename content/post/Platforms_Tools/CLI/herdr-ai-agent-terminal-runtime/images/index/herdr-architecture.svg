<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Herdr 架构图：client、server 与控制平面">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B87BF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#26324a"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#0B1220"/>
  <rect width="1200" height="720" fill="url(#dots)" opacity="0.5"/>
  <text x="1160" y="36" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="15" fill="#475569">zata.cc</text>

  <!-- ===================== CLIENT ===================== -->
  <rect x="48" y="140" width="232" height="300" rx="14" fill="#0e1730" stroke="#3b4a68" stroke-width="2"/>
  <text x="64" y="176" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">client — 显示器 + 键盘</text>
  <text x="64" y="200" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#9FB3D1">侧边栏和窗格只是渲染出来的视图</text>
  <circle cx="70" cy="230" r="3" fill="#5B87BF"/>
  <text x="82" y="235" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#cbd5e1">点击 / 拖拽 / 右键菜单</text>
  <circle cx="70" cy="258" r="3" fill="#5B87BF"/>
  <text x="82" y="263" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13" fill="#cbd5e1">prefix+c / v / w 键位</text>
  <circle cx="70" cy="286" r="3" fill="#5B87BF"/>
  <text x="82" y="291" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#cbd5e1">侧边栏汇总所有 Agent</text>
  <circle cx="70" cy="314" r="3" fill="#5B87BF"/>
  <text x="82" y="319" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#cbd5e1">主题 / 复制行为跟随 client</text>
  <text x="64" y="412" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#64748b">prefix+q 分离：只关屏幕</text>

  <!-- client <-> server -->
  <line x1="280" y1="250" x2="376" y2="250" stroke="#64748b" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="328" y="238" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#9FB3D1">attach</text>
  <text x="328" y="270" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#64748b">分离不停止</text>

  <!-- ===================== SERVER ===================== -->
  <rect x="376" y="88" width="452" height="548" rx="16" fill="#0d1526" stroke="url(#accent)" stroke-width="2.5"/>
  <text x="396" y="124" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">herdr server（后台常驻）</text>
  <text x="396" y="148" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#9FB3D1">所有 pty、布局、Agent 状态都活在这个进程里</text>

  <!-- workspace 1 -->
  <rect x="396" y="168" width="412" height="170" rx="10" fill="#101a30" stroke="#2c3a58" stroke-width="1.5"/>
  <text x="412" y="196" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13" fill="#9FB3D1">workspace · zata.cc 博客 (w4)</text>
  <rect x="412" y="212" width="124" height="104" rx="8" fill="#0e1730" stroke="#31415f" stroke-width="1.5"/>
  <text x="422" y="234" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" font-weight="700" fill="#e2e8f0">codebuddy</text>
  <circle cx="428" cy="258" r="5.5" fill="#eab308"/>
  <text x="440" y="262" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#cbd5e1">working</text>
  <text x="422" y="292" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#64748b">修 build 报错</text>
  <rect x="548" y="212" width="124" height="104" rx="8" fill="#0e1730" stroke="#31415f" stroke-width="1.5"/>
  <text x="558" y="234" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" font-weight="700" fill="#e2e8f0">kimi</text>
  <circle cx="564" cy="258" r="5.5" fill="#ef4444"/>
  <text x="576" y="262" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#cbd5e1">blocked</text>
  <text x="558" y="292" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#64748b">等你批准命令</text>
  <rect x="684" y="212" width="124" height="104" rx="8" fill="#0e1730" stroke="#31415f" stroke-width="1.5"/>
  <text x="694" y="234" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" font-weight="700" fill="#e2e8f0">codex</text>
  <circle cx="700" cy="258" r="5.5" fill="#22c55e"/>
  <text x="712" y="262" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#cbd5e1">done</text>
  <text x="694" y="292" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#64748b">待验收</text>

  <!-- workspace 2 -->
  <rect x="396" y="352" width="412" height="120" rx="10" fill="#101a30" stroke="#2c3a58" stroke-width="1.5"/>
  <text x="412" y="380" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13" fill="#9FB3D1">workspace · freshai (wA)</text>
  <rect x="412" y="392" width="124" height="64" rx="8" fill="#0e1730" stroke="#31415f" stroke-width="1.5"/>
  <text x="422" y="412" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#e2e8f0">qodercli</text>
  <circle cx="428" cy="436" r="5" fill="#64748b"/>
  <text x="440" y="440" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" fill="#cbd5e1">idle</text>
  <rect x="548" y="392" width="124" height="64" rx="8" fill="#0e1730" stroke="#31415f" stroke-width="1.5"/>
  <text x="558" y="412" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#94a3b8">空 pane</text>
  <text x="558" y="440" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" fill="#64748b">shell</text>

  <!-- restore note -->
  <rect x="396" y="492" width="412" height="128" rx="10" fill="#0f1a33" stroke="#3b4a68" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="412" y="520" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">重启恢复（server 重启后）</text>
  <text x="412" y="546" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#9FB3D1">布局：原样恢复 ✓</text>
  <text x="412" y="568" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#9FB3D1">装了集成的 Agent：恢复原对话 ✓</text>
  <text x="412" y="590" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#9FB3D1">shell 里跑一半的命令：不会续跑 ✗</text>

  <!-- control plane <-> server -->
  <line x1="828" y1="250" x2="872" y2="250" stroke="#64748b" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="850" y="238" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10.5" fill="#9FB3D1">RPC</text>
  <line x1="872" y1="392" x2="828" y2="392" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="850" y="380" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10.5" fill="#9FB3D1">hook</text>

  <!-- ===================== CONTROL PLANE ===================== -->
  <rect x="872" y="140" width="280" height="360" rx="14" fill="#0e1730" stroke="#2c3a58" stroke-width="2"/>
  <text x="888" y="172" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">控制平面</text>
  <text x="888" y="194" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#9FB3D1">unix socket · JSON-RPC</text>
  <text x="888" y="224" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#cbd5e1">herdr pane run / read</text>
  <text x="888" y="248" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#cbd5e1">herdr pane wait-output</text>
  <text x="888" y="272" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#cbd5e1">herdr agent prompt --wait</text>
  <text x="888" y="296" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#cbd5e1">herdr agent wait --until</text>
  <text x="888" y="320" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#cbd5e1">events.subscribe(...)</text>
  <line x1="888" y1="340" x2="1136" y2="340" stroke="#24314e" stroke-width="1.5"/>
  <text x="888" y="368" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">Agent 侧集成（hook）上报：</text>
  <text x="888" y="392" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#cbd5e1">pane.report-agent</text>
  <text x="888" y="414" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" fill="#cbd5e1">pane.report-agent-session</text>
  <text x="888" y="444" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#64748b">谁都能调：脚本、CI、别的 Agent</text>

  <!-- control plane consumers -->
  <line x1="1012" y1="500" x2="1012" y2="552" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="1012" y="580" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12.5" fill="#9FB3D1">脚本 / 编排 / 其他 Agent</text>

  <!-- ===================== LEGEND ===================== -->
  <circle cx="56" cy="664" r="6" fill="#eab308"/>
  <text x="70" y="669" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#9FB3D1">working 干活中</text>
  <circle cx="230" cy="664" r="6" fill="#ef4444"/>
  <text x="244" y="669" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#9FB3D1">blocked 等你处理</text>
  <circle cx="430" cy="664" r="6" fill="#22c55e"/>
  <text x="444" y="669" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#9FB3D1">done 待验收 · 点击变空心</text>
  <circle cx="700" cy="664" r="6" fill="#64748b"/>
  <text x="714" y="669" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#9FB3D1">idle 空闲可派活</text>
</svg>
