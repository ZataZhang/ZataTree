<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img"><title>同一份订单数据，两种逻辑组织方式</title><rect width="1000" height="520" fill="#0b1220"/><g font-family="sans-serif"><text x="40" y="52" font-size="28" fill="#f8fafc">同一份订单数据，两种逻辑组织方式</text><rect x="40" y="100" width="440" height="295" rx="14" fill="#142237" stroke="#5b87bf" stroke-width="2"/><text x="62" y="138" font-size="24" fill="#f8fafc">行存：按记录组织</text><rect x="520" y="100" width="440" height="295" rx="14" fill="#142237" stroke="#5b87bf" stroke-width="2"/><text x="542" y="138" font-size="24" fill="#f8fafc">列存：按字段组织</text><rect x="62" y="166" width="395" height="46" rx="7" fill="#233c59"/><text x="78" y="196" font-size="20" fill="#f8fafc">订单 A | 用户 1 | 金额 80</text><rect x="62" y="228" width="395" height="46" rx="7" fill="#233c59"/><text x="78" y="258" font-size="20" fill="#f8fafc">订单 B | 用户 2 | 金额 120</text><rect x="62" y="290" width="395" height="46" rx="7" fill="#233c59"/><text x="78" y="320" font-size="20" fill="#f8fafc">订单 C | 用户 1 | 金额 60</text><rect x="545" y="160" width="116" height="203" rx="7" fill="#233c59"/><text x="567" y="191" font-size="20" fill="#f8fafc">订单</text><text x="573" y="235" font-size="22" fill="#cbd5e1">A</text><text x="573" y="283" font-size="22" fill="#cbd5e1">B</text><text x="573" y="331" font-size="22" fill="#cbd5e1">C</text><rect x="680" y="160" width="116" height="203" rx="7" fill="#233c59"/><text x="702" y="191" font-size="20" fill="#f8fafc">用户</text><text x="708" y="235" font-size="22" fill="#cbd5e1">1</text><text x="708" y="283" font-size="22" fill="#cbd5e1">2</text><text x="708" y="331" font-size="22" fill="#cbd5e1">1</text><rect x="815" y="160" width="116" height="203" rx="7" fill="#285055"/><text x="837" y="191" font-size="20" fill="#f8fafc">金额</text><text x="843" y="235" font-size="22" fill="#cbd5e1">80</text><text x="843" y="283" font-size="22" fill="#cbd5e1">120</text><text x="843" y="331" font-size="22" fill="#cbd5e1">60</text><text x="40" y="450" font-size="22" fill="#cbd5e1">点查一笔订单：关注整条记录</text><text x="520" y="450" font-size="22" fill="#cbd5e1">汇总销售额：关注金额等少数列</text></g></svg>