<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img"><title>从业务数据构建缓存、搜索与分析能力</title><rect width="1000" height="540" fill="#0b1220"/><g font-family="sans-serif"><text x="40" y="52" font-size="28" fill="#f8fafc">从业务数据构建缓存、搜索与分析能力</text><rect x="40" y="100" width="270" height="130" rx="14" fill="#142237" stroke="#5b87bf" stroke-width="2"/><text x="62" y="138" font-size="24" fill="#f8fafc">业务应用</text><text x="62" y="176" font-size="19" fill="#cbd5e1">交易 / 搜索 / 报表</text><rect x="385" y="100" width="340" height="130" rx="14" fill="#142237" stroke="#5b87bf" stroke-width="2"/><text x="407" y="138" font-size="24" fill="#f8fafc">MySQL / PostgreSQL</text><text x="407" y="176" font-size="19" fill="#cbd5e1">订单权威状态</text><rect x="40" y="320" width="270" height="130" rx="14" fill="#142237" stroke="#5eead4" stroke-width="2"/><text x="62" y="358" font-size="24" fill="#f8fafc">Redis</text><text x="62" y="396" font-size="19" fill="#cbd5e1">应用维护缓存</text><rect x="385" y="320" width="255" height="130" rx="14" fill="#142237" stroke="#a78bfa" stroke-width="2"/><text x="407" y="358" font-size="24" fill="#f8fafc">搜索引擎</text><text x="407" y="396" font-size="19" fill="#cbd5e1">商品 / 日志检索</text><rect x="705" y="320" width="255" height="130" rx="14" fill="#142237" stroke="#5eead4" stroke-width="2"/><text x="727" y="358" font-size="24" fill="#f8fafc">Doris / ClickHouse</text><text x="727" y="396" font-size="19" fill="#cbd5e1">指标 / 报表分析</text><g fill="none" stroke="#7c9cf5" stroke-width="3"><path d="M310 165H380"/><path d="M175 230V314"/><path d="M555 230V275H512V314"/><path d="M555 275H832V314"/></g><text x="320" y="148" font-size="18" fill="#cbd5e1">读写</text><text x="60" y="278" font-size="18" fill="#cbd5e1">回源与缓存失效</text><text x="620" y="266" font-size="18" fill="#cbd5e1">CDC / 数据同步</text><text x="40" y="500" font-size="21" fill="#cbd5e1">按需求增加分支；同步延迟、重放和权限变更都需要设计。</text></g></svg>