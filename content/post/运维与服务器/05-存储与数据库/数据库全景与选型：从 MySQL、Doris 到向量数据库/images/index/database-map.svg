<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img"><title>数据库分类：沿三个维度理解</title><rect width="1000" height="520" fill="#0b1220"/><g font-family="sans-serif"><text x="40" y="52" font-size="28" fill="#f8fafc">数据库分类：沿三个维度理解</text><rect x="40" y="95" width="280" height="330" rx="14" fill="#142237" stroke="#5b87bf" stroke-width="2"/><text x="62" y="133" font-size="24" fill="#f8fafc">工作负载</text><text x="62" y="171" font-size="19" fill="#cbd5e1">OLTP · 业务事务</text><text x="62" y="203" font-size="19" fill="#cbd5e1">订单 / 库存 / 账户</text><text x="62" y="235" font-size="19" fill="#cbd5e1">OLAP · 扫描与聚合</text><text x="62" y="267" font-size="19" fill="#cbd5e1">报表 / 日志 / 看板</text><text x="62" y="299" font-size="19" fill="#cbd5e1">检索 · 找到相关内容</text><text x="62" y="331" font-size="19" fill="#cbd5e1">文本 / 关系 / 相似度</text><rect x="360" y="95" width="280" height="330" rx="14" fill="#142237" stroke="#5b87bf" stroke-width="2"/><text x="382" y="133" font-size="24" fill="#f8fafc">数据模型</text><text x="382" y="171" font-size="19" fill="#cbd5e1">关系 · 表与约束</text><text x="382" y="203" font-size="19" fill="#cbd5e1">文档 · 嵌套结构</text><text x="382" y="235" font-size="19" fill="#cbd5e1">键值 · 按 key 访问</text><text x="382" y="267" font-size="19" fill="#cbd5e1">图 · 节点与关系</text><text x="382" y="299" font-size="19" fill="#cbd5e1">向量 · 相似度检索</text><rect x="680" y="95" width="280" height="330" rx="14" fill="#142237" stroke="#5b87bf" stroke-width="2"/><text x="702" y="133" font-size="24" fill="#f8fafc">部署方式</text><text x="702" y="171" font-size="19" fill="#cbd5e1">进程内 · SQLite</text><text x="702" y="203" font-size="19" fill="#cbd5e1">进程内分析 · DuckDB</text><text x="702" y="235" font-size="19" fill="#cbd5e1">数据库服务</text><text x="702" y="267" font-size="19" fill="#cbd5e1">单机 / 副本 / 分片</text><text x="702" y="299" font-size="19" fill="#cbd5e1">按负载评估扩展方式</text><text x="40" y="480" font-size="22" fill="#cbd5e1">三个维度可组合；产品名称不能代替工作负载分析。</text></g></svg>