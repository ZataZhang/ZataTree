<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#6489ba" stroke-width="1.5"/></marker></defs><rect width="1200" height="640" rx="24" fill="#0b1220"/><g font-family="sans-serif"><text x="48" y="62" fill="#f8fafc" font-size="30" font-weight="700">把“网络不通”拆成五个可验证的问题</text><text x="48" y="99" fill="#a8b9ce" font-size="18">排障顺序示意，不包含原始抓包或控制台截图</text><rect x="48" y="130" width="1104" height="77" rx="12" fill="#15243a"/><text x="70" y="178" fill="#75c4b6" font-size="28">01</text><text x="140" y="163" fill="#f8fafc" font-size="21">发送端</text><text x="140" y="189" fill="#a8b9ce" font-size="16">ip route get / ip rule</text><text x="620" y="175" fill="#e0e8f2" font-size="21">路由选对接口了吗？</text><rect x="48" y="221" width="1104" height="77" rx="12" fill="#15243a"/><text x="70" y="269" fill="#75c4b6" font-size="28">02</text><text x="140" y="254" fill="#f8fafc" font-size="21">传输路径</text><text x="140" y="280" fill="#a8b9ce" font-size="16">双端 tcpdump / 安全组 / ACL</text><text x="620" y="266" fill="#e0e8f2" font-size="21">对端网卡看见同一个包吗？</text><rect x="48" y="312" width="1104" height="77" rx="12" fill="#15243a"/><text x="70" y="360" fill="#75c4b6" font-size="28">03</text><text x="140" y="345" fill="#f8fafc" font-size="21">主机与隧道</text><text x="140" y="371" fill="#a8b9ce" font-size="16">wg show / 防火墙 / 路由源地址</text><text x="620" y="357" fill="#e0e8f2" font-size="21">端点、源地址、反向路径正确吗？</text><rect x="48" y="403" width="1104" height="77" rx="12" fill="#15243a"/><text x="70" y="451" fill="#75c4b6" font-size="28">04</text><text x="140" y="436" fill="#f8fafc" font-size="21">容器与入口</text><text x="140" y="462" fill="#a8b9ce" font-size="16">overlay / 标签 / 容器端口</text><text x="620" y="448" fill="#e0e8f2" font-size="21">容器健康，代理确实能访问吗？</text><rect x="48" y="494" width="1104" height="77" rx="12" fill="#15243a"/><text x="70" y="542" fill="#75c4b6" font-size="28">05</text><text x="140" y="527" fill="#f8fafc" font-size="21">公网业务</text><text x="140" y="553" fill="#a8b9ce" font-size="16">证书链 / HTTP / CSS 与 JS</text><text x="620" y="539" fill="#e0e8f2" font-size="21">真实域名与资源都返回成功吗？</text><text x="48" y="620" fill="#a8b9ce" font-size="16">每一层单独建立证据；节点 Ready 与 ping 成功都不能替代公网验收。</text></g></svg>