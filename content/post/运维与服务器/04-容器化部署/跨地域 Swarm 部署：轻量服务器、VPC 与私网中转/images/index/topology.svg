url(#arrow)" marker-end="url(#arrow)"/><path d="M375 515L825 515" stroke="#6489ba" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M990 445L765 360" stroke="#6489ba" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="60" y="370" fill="#a8b9ce" font-size="17">逻辑业务路径：ENTRY ↔ COMPUTE</text><text x="410" y="495" fill="#a8b9ce" font-size="17">隧道实际经 RELAY 承载</text><text x="48" y="620" fill="#a8b9ce" font-size="16">角色与路径示意；不表示 VPC 对等连接支持传递路由。</text></g></svg>