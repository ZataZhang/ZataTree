<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="同名网络冲突：入口节点的 swarm overlay 与计算节点上的本地 bridge 都叫 traefik-public，worker 调度任务时按名字解析命中了本地 bridge，10.0.1.11 不在其子网内，任务被拒">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B87BF"/><stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#26324a"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#0B1220"/>
  <rect width="1200" height="520" fill="url(#dots)" opacity="0.45"/>
  <text x="1160" y="34" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#475569">zata.cc</text>

  <text x="60" y="64" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="26" font-weight="600" fill="#F8FAFC">同名不同驱动：overlay 与本地 bridge 撞名</text>
  <rect x="60" y="80" width="112" height="6" rx="3" fill="url(#accent)"/>

  <rect x="60" y="140" width="430" height="190" rx="14" fill="#101a2e" stroke="#2f3f5c" stroke-width="1.4"/>
  <text x="78" y="172" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#93c5fd">入口节点</text>

  <rect x="78" y="188" width="394" height="118" rx="10" fill="#152140" stroke="#31456b"/>
  <text x="96" y="216" font-family="ui-monospace,Menlo,monospace" font-size="15" font-weight="600" fill="#e2e8f0">traefik-public</text>
  <text x="96" y="240" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#93c5fd">swarm overlay · 入口网络</text>
  <text x="96" y="264" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#a5b4fc">10.0.1.0/24</text>
  <text x="96" y="288" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#8fa6c4">Traefik 与需要入站的服务接在这里</text>

  <rect x="710" y="120" width="430" height="300" rx="14" fill="#0f1a20" stroke="#1f4d52" stroke-width="1.4"/>
  <text x="728" y="152" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#5eead4">计算节点</text>

  <rect x="728" y="168" width="394" height="112" rx="10" fill="#1c1018" stroke="#f87171" stroke-width="1.6"/>
  <text x="746" y="196" font-family="ui-monospace,Menlo,monospace" font-size="15" font-weight="600" fill="#fecaca">traefik-public</text>
  <text x="746" y="220" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#fca5a5">本地 bridge · 本机自己的 Traefik 在用</text>
  <text x="746" y="244" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#fca5a5">172.30.0.0/16</text>
  <text x="746" y="266" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#d1a0a8">解析先命中它 → 里面没有 10.0.1.11</text>

  <rect x="728" y="296" width="394" height="100" rx="10" fill="none" stroke="#2f3f5c" stroke-dasharray="7 6" opacity="0.55"/>
  <text x="746" y="324" font-family="ui-monospace,Menlo,monospace" font-size="15" font-weight="600" fill="#7c8ba1">traefik-public</text>
  <text x="746" y="348" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#7c8ba1">swarm overlay（集群里其实存在）</text>
  <text x="746" y="372" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#7c8ba1">10.0.1.0/24</text>

  <line x1="476" y1="246" x2="682" y2="214" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="580" y="222" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#94a3b8">按名字解析</text>

  <circle cx="698" cy="214" r="15" fill="#2a1220" stroke="#f87171" stroke-width="1.6"/>
  <path d="M691,207 L705,221 M705,207 L691,221" stroke="#f87171" stroke-width="2.2" stroke-linecap="round"/>

  <text x="60" y="400" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#f87171">invalid config for network traefik-public: no configured subnet contains IP address 10.0.1.11</text>

  <text x="60" y="436" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#64748b">看到 “no configured subnet contains IP address”，先怀疑同名不同驱动，而不是网段规划写错。</text>
  <text x="60" y="462" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#64748b">最省事的解法：新建一个不同名的 overlay，入口侧的 Traefik 同时接入新旧两个网络，应用栈改指新网络。</text>
</svg>
