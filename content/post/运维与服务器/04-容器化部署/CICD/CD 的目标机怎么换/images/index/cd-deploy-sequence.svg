<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="一次生产发布的八个阶段：准备、构建镜像、打包上传、远端解包、排空队列、部署栈、健康校验、切换指针并恢复消费">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B87BF"/><stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#26324a"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B87BF"/>
    </marker>
  </defs>
  <rect width="1200" height="400" fill="#0B1220"/>
  <rect width="1200" height="400" fill="url(#dots)" opacity="0.45"/>
  <text x="1160" y="34" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#475569">zata.cc</text>

  <text x="60" y="64" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="26" font-weight="600" fill="#F8FAFC">一次生产发布：八个阶段，两个执行位置</text>
  <rect x="60" y="80" width="112" height="6" rx="3" fill="url(#accent)"/>

  <rect x="60" y="112" width="560" height="26" rx="6" fill="#152140"/>
  <text x="72" y="130" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#93c5fd">GitHub Actions runner</text>
  <rect x="624" y="112" width="554" height="26" rx="6" fill="#0f1a20"/>
  <text x="636" y="130" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#5eead4">目标服务器（manager 节点）</text>

  <rect x="60" y="152" width="124" height="112" rx="10" fill="#152140" stroke="#31456b"/>
  <text x="122" y="180" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">① 准备</text>
  <text x="122" y="204" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#8fa6c4">定环境</text>
  <text x="122" y="222" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#8fa6c4">定镜像标签</text>
  <text x="122" y="246" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#64748b">sha-env</text>

  <line x1="188" y1="208" x2="200" y2="208" stroke="#5B87BF" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="204" y="152" width="124" height="112" rx="10" fill="#152140" stroke="#31456b"/>
  <text x="266" y="180" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">② 构建镜像</text>
  <text x="266" y="204" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#8fa6c4">backend</text>
  <text x="266" y="222" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#8fa6c4">frontend / portal</text>
  <text x="266" y="246" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10" fill="#64748b">推到私有仓库</text>

  <line x1="332" y1="208" x2="344" y2="208" stroke="#5B87BF" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="348" y="152" width="124" height="112" rx="10" fill="#152140" stroke="#31456b"/>
  <text x="410" y="180" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">③ 打包上传</text>
  <text x="410" y="204" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#8fa6c4">发布包 scp</text>
  <text x="410" y="222" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#8fa6c4">到 incoming/</text>

  <line x1="476" y1="208" x2="488" y2="208" stroke="#5B87BF" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="492" y="152" width="124" height="112" rx="10" fill="#152140" stroke="#31456B"/>
  <text x="554" y="180" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">④ 远端解包</text>
  <text x="554" y="202" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#8fa6c4">独立发布目录</text>
  <text x="554" y="222" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="9.5" fill="#64748b">tag-run-attempt</text>

  <line x1="620" y1="208" x2="632" y2="208" stroke="#5B87BF" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="636" y="152" width="124" height="112" rx="10" fill="#0f1a20" stroke="#1f4d52"/>
  <text x="698" y="180" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" font-weight="600" fill="#a5f3fc">⑤ 排空队列</text>
  <text x="698" y="204" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#7f9ea6">暂停消费</text>
  <text x="698" y="222" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#7f9ea6">等在途任务为 0</text>

  <line x1="764" y1="208" x2="776" y2="208" stroke="#5B87BF" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="780" y="152" width="124" height="112" rx="10" fill="#0f1a20" stroke="#1f4d52"/>
  <text x="842" y="180" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" font-weight="600" fill="#a5f3fc">⑥ 部署栈</text>
  <text x="842" y="204" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#7f9ea6">stack deploy</text>
  <text x="842" y="222" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#7f9ea6">--with-registry-auth</text>

  <line x1="908" y1="208" x2="920" y2="208" stroke="#5B87BF" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="924" y="152" width="124" height="112" rx="10" fill="#0f1a20" stroke="#1f4d52"/>
  <text x="986" y="180" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" font-weight="600" fill="#a5f3fc">⑦ 校验</text>
  <text x="986" y="204" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#7f9ea6">任务稳定</text>
  <text x="986" y="222" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#7f9ea6">HTTP 200</text>

  <line x1="1052" y1="208" x2="1064" y2="208" stroke="#5B87BF" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="1068" y="152" width="110" height="112" rx="10" fill="#152140" stroke="#8a6520"/>
  <text x="1123" y="180" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" font-weight="600" fill="#fbbf24">⑧ 切指针</text>
  <text x="1123" y="204" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#c9b179">current 软链</text>
  <text x="1123" y="222" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#c9b179">恢复消费</text>

  <text x="60" y="300" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#64748b">①②③ 在 runner 上；④～⑧ 在服务器上，由远端脚本执行。任一步失败：先排空，再部署上一版并重新校验。</text>
  <text x="60" y="324" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#64748b">指针最后切换——它代表“线上版本”，不能先改再验证。</text>
</svg>
