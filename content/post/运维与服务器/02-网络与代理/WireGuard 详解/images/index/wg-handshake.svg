<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="WireGuard 握手时序：一次往返完成 Noise_IK 握手，随后用会话密钥加密数据，每 120 秒重新握手">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B87BF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#26324a"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#0B1220"/>
  <rect width="1200" height="560" fill="url(#dots)" opacity="0.5"/>
  <text x="1160" y="36" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#475569">zata.cc</text>

  <text x="60" y="72" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="30" font-weight="600" fill="#F8FAFC">握手：一次往返，之后只剩无状态的包</text>
  <rect x="60" y="90" width="112" height="6" rx="3" fill="url(#accent)"/>

  <!-- lifelines -->
  <rect x="190" y="118" width="220" height="54" rx="10" fill="#132437" stroke="#22D3EE" stroke-width="1.6"/>
  <text x="300" y="142" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="16" fill="#22D3EE">发起方 A</text>
  <text x="300" y="162" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#94a3b8">10.99.0.1</text>

  <rect x="790" y="118" width="220" height="54" rx="10" fill="#1b1a2e" stroke="#8B5CF6" stroke-width="1.6"/>
  <text x="900" y="142" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="16" fill="#a78bfa">响应方 B</text>
  <text x="900" y="162" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#94a3b8">10.99.0.2</text>

  <line x1="300" y1="172" x2="300" y2="452" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 6"/>
  <line x1="900" y1="172" x2="900" y2="452" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 6"/>

  <!-- message 1 -->
  <line x1="304" y1="212" x2="896" y2="212" stroke="#22D3EE" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="600" y="200" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="15" fill="#e2e8f0">Handshake Initiation</text>
  <text x="600" y="232" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#94a3b8">加密的静态公钥 + 单调递增时间戳</text>

  <!-- message 2 -->
  <line x1="896" y1="286" x2="304" y2="286" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="274" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="15" fill="#e2e8f0">Handshake Response</text>
  <text x="600" y="306" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#94a3b8">加密的空包，确认双向可达</text>

  <!-- 1 RTT bracket -->
  <line x1="1040" y1="212" x2="1040" y2="286" stroke="#5B87BF" stroke-width="1.6"/>
  <line x1="1034" y1="212" x2="1046" y2="212" stroke="#5B87BF" stroke-width="1.6"/>
  <line x1="1034" y1="286" x2="1046" y2="286" stroke="#5B87BF" stroke-width="1.6"/>
  <text x="1058" y="254" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#5B87BF">1-RTT</text>

  <!-- session keys -->
  <rect x="356" y="330" width="488" height="52" rx="10" fill="#0f1a2e" stroke="#3b4a68"/>
  <text x="600" y="362" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#cbd5e1">Noise_IK 派生两对会话密钥（收 / 发分离）</text>

  <!-- data -->
  <line x1="304" y1="420" x2="896" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="896" y1="420" x2="304" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="408" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="15" fill="#e2e8f0">Data</text>
  <text x="600" y="442" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#94a3b8">ChaCha20-Poly1305 · 每包 16 字节认证标签</text>

  <!-- bottom notes -->
  <line x1="60" y1="480" x2="1140" y2="480" stroke="#1e293b" stroke-width="1"/>
  <text x="150" y="512" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#94a3b8">每 120s 重新握手</text>
  <text x="450" y="512" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#94a3b8">180s 后旧密钥作废（前向保密）</text>
  <text x="750" y="512" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#94a3b8">时间戳防重放</text>
  <text x="1020" y="512" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#f472b6">两端时钟偏差过大 → 握手失败</text>
</svg>
