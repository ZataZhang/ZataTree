<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="MTU 拆解：1500 字节帧减去 60 或 80 字节封装开销，得到 1440 或 1420 的有效载荷">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B87BF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#26324a"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="#0B1220"/>
  <rect width="1200" height="520" fill="url(#dots)" opacity="0.5"/>
  <text x="1160" y="36" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#475569">zata.cc</text>

  <text x="60" y="72" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="30" font-weight="600" fill="#F8FAFC">1420 是怎么来的：一层封装减掉 80 字节</text>
  <rect x="60" y="90" width="112" height="6" rx="3" fill="url(#accent)"/>

  <!-- header detail -->
  <text x="80" y="136" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#94a3b8">封装开销明细（放大示意）</text>

  <rect x="80" y="150" width="140" height="52" rx="8" fill="#152140" stroke="#3b4a68"/>
  <text x="150" y="174" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#e2e8f0">外层 IP 头</text>
  <text x="150" y="193" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5B87BF">20 / 40 B</text>

  <rect x="232" y="150" width="120" height="52" rx="8" fill="#152140" stroke="#3b4a68"/>
  <text x="292" y="174" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#e2e8f0">UDP 头</text>
  <text x="292" y="193" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5B87BF">8 B</text>

  <rect x="364" y="150" width="150" height="52" rx="8" fill="#152140" stroke="#3b4a68"/>
  <text x="439" y="174" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#e2e8f0">WG 头</text>
  <text x="439" y="193" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5B87BF">16 B</text>

  <rect x="526" y="150" width="150" height="52" rx="8" fill="#152140" stroke="#3b4a68"/>
  <text x="601" y="174" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#e2e8f0">认证标签</text>
  <text x="601" y="193" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#5B87BF">16 B</text>

  <text x="700" y="182" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#64748b">= 每包固定多出 60 字节（IPv4）</text>

  <!-- ipv4 bar -->
  <text x="80" y="250" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="15" fill="#e2e8f0">外层 IPv4</text>
  <rect x="80" y="262" width="42" height="56" fill="#f87171" opacity="0.85"/>
  <rect x="122" y="262" width="998" height="56" rx="2" fill="#132437" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="621" y="297" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="15" fill="#22D3EE">有效载荷 1440 字节 → MTU 1440</text>
  <text x="101" y="295" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#0B1220">60</text>
  <text x="1120" y="252" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#64748b">总长 1500</text>

  <!-- ipv6 bar -->
  <text x="80" y="368" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="15" fill="#e2e8f0">外层 IPv6</text>
  <rect x="80" y="380" width="56" height="56" fill="#f87171" opacity="0.85"/>
  <rect x="136" y="380" width="984" height="56" rx="2" fill="#132437" stroke="#34D399" stroke-width="1.4"/>
  <text x="628" y="415" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="15" fill="#34D399">有效载荷 1420 字节 → MTU 1420（wg-quick 默认）</text>
  <text x="108" y="413" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#0B1220">80</text>

  <text x="80" y="478" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#94a3b8">TCP MSS = MTU − 40（IP 头 20 + TCP 头 20）= 1380；用 --clamp-mss-to-pmtu 让内核自己算更稳。</text>
  <text x="80" y="502" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#64748b">条宽按字节等比缩放；图中 60 / 80 字节的头部在等比下只有几十像素，故用上方明细放大展示。</text>
</svg>
