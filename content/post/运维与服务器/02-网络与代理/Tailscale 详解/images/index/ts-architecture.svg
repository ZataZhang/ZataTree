<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Tailscale 架构：控制面只负责身份与密钥协调，节点优先直连；直连失败时经 DERP 中继转发已加密的密文">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B87BF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#26324a"/>
    </pattern>
    <marker id="arrOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34D399"/>
    </marker>
    <marker id="arrCtl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B87BF"/>
    </marker>
    <marker id="arrWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#0B1220"/>
  <rect width="1200" height="640" fill="url(#dots)" opacity="0.5"/>
  <text x="1160" y="36" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#475569">zata.cc</text>

  <text x="60" y="72" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="30" font-weight="600" fill="#F8FAFC">控制面做媒，数据面直连，DERP 兜底</text>
  <rect x="60" y="90" width="112" height="6" rx="3" fill="url(#accent)"/>

  <!-- coordination server -->
  <rect x="410" y="118" width="380" height="96" rx="14" fill="#161d38" stroke="#5B87BF" stroke-width="1.8"/>
  <text x="600" y="150" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="18" font-weight="600" fill="#5B87BF">控制面 Coordination Server</text>
  <text x="600" y="176" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#cbd5e1">身份认证 · 公钥分发 · 地址分配 · 端点交换</text>
  <text x="600" y="198" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#64748b">从不转发业务流量</text>

  <path d="M470 218 L330 296" stroke="#5B87BF" stroke-width="1.6" stroke-dasharray="7 6" fill="none" marker-end="url(#arrCtl)"/>
  <path d="M730 218 L870 296" stroke="#5B87BF" stroke-width="1.6" stroke-dasharray="7 6" fill="none" marker-end="url(#arrCtl)"/>
  <text x="300" y="262" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5B87BF">告知对方公钥与候选端点</text>
  <text x="905" y="262" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5B87BF">上报自己的端点</text>

  <!-- node A -->
  <rect x="110" y="300" width="280" height="132" rx="14" fill="#0e1730" stroke="#3b4a68" stroke-width="2"/>
  <text x="250" y="334" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="16" font-weight="600" fill="#22D3EE">节点 A</text>
  <text x="250" y="358" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#94a3b8">100.64.0.1</text>
  <text x="250" y="388" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#cbd5e1">NAT 后面没关系</text>
  <text x="250" y="412" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#64748b">UDP 41641</text>

  <!-- node B -->
  <rect x="810" y="300" width="280" height="132" rx="14" fill="#0e1730" stroke="#3b4a68" stroke-width="2"/>
  <text x="950" y="334" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="16" font-weight="600" fill="#8B5CF6">节点 B</text>
  <text x="950" y="358" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#94a3b8">100.64.0.2</text>
  <text x="950" y="388" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#cbd5e1">同 tailnet</text>
  <text x="950" y="412" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#64748b">UDP 41641</text>

  <!-- direct path -->
  <line x1="396" y1="352" x2="804" y2="352" stroke="#34D399" stroke-width="3" marker-end="url(#arrOk)"/>
  <line x1="804" y1="352" x2="396" y2="352" stroke="#34D399" stroke-width="3" marker-end="url(#arrOk)"/>
  <text x="600" y="340" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="15" fill="#34D399">优先：直连（direct）</text>
  <text x="600" y="378" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#64748b">WireGuard · 端到端加密 · 不走第三方</text>

  <!-- DERP -->
  <rect x="440" y="500" width="320" height="76" rx="12" fill="#241a10" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="8 6"/>
  <text x="600" y="528" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="15" fill="#f59e0b">DERP 中继</text>
  <text x="600" y="552" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#94a3b8">打洞失败时兜底 · 只转发密文</text>

  <path d="M250 436 L470 500" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#arrWarn)"/>
  <path d="M950 436 L730 500" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#arrWarn)"/>
  <text x="330" y="478" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#f59e0b">relay</text>
  <text x="880" y="478" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#f59e0b">relay</text>

  <text x="600" y="612" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#64748b">DERP 转发的是已经过 WireGuard 加密的包，中继本身解不开内容 —— 但会知道「谁在和谁通信」。</text>
</svg>
