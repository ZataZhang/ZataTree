<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">API 限流的多个计数维度</title>
  <desc id="desc">请求同时受到来源 IP、用户或 API Key、租户、接口操作和全局并发预算限制。</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#5B87BF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="460" rx="20" fill="#0B1220"/>
  <text x="54" y="56" fill="#F8FAFC" font-family="sans-serif" font-size="28" font-weight="700">限流要同时回答“谁在调用”和“调用多贵”</text>
  <rect x="435" y="88" width="330" height="78" rx="15" fill="#132039" stroke="url(#line)" stroke-width="3"/>
  <text x="600" y="122" text-anchor="middle" fill="#F8FAFC" font-family="sans-serif" font-size="21">请求到达 API</text>
  <text x="600" y="148" text-anchor="middle" fill="#9FB3D1" font-family="sans-serif" font-size="16">鉴权后识别身份与操作成本</text>
  <g fill="none" stroke="#3B4A68" stroke-width="2.5">
    <path d="M600 166 V202 H139 V227"/>
    <path d="M600 166 V202 H369 V227"/>
    <path d="M600 166 V202 H600 V227"/>
    <path d="M600 166 V202 H831 V227"/>
    <path d="M600 166 V202 H1061 V227"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="48" y="228" width="182" height="118" rx="14" fill="#101A2E" stroke="#475569" stroke-width="2"/>
    <text x="139" y="268" fill="#F8FAFC" font-size="19">来源 IP</text>
    <text x="139" y="299" fill="#94A3B8" font-size="15">挡单一来源突发</text>
    <text x="139" y="325" fill="#FBBF24" font-size="14">注意 NAT 共用地址</text>
    <rect x="278" y="228" width="182" height="118" rx="14" fill="#101A2E" stroke="#475569" stroke-width="2"/>
    <text x="369" y="268" fill="#F8FAFC" font-size="19">用户 / API Key</text>
    <text x="369" y="299" fill="#94A3B8" font-size="15">限制身份配额</text>
    <text x="369" y="325" fill="#FBBF24" font-size="14">Key 不等于授权</text>
    <rect x="509" y="228" width="182" height="118" rx="14" fill="#101A2E" stroke="#475569" stroke-width="2"/>
    <text x="600" y="268" fill="#F8FAFC" font-size="19">租户</text>
    <text x="600" y="299" fill="#94A3B8" font-size="15">隔离共享资源</text>
    <text x="600" y="325" fill="#22D3EE" font-size="14">防止一个租户占满</text>
    <rect x="740" y="228" width="182" height="118" rx="14" fill="#101A2E" stroke="#475569" stroke-width="2"/>
    <text x="831" y="268" fill="#F8FAFC" font-size="19">接口 / 操作</text>
    <text x="831" y="299" fill="#94A3B8" font-size="15">搜索、导出、短信</text>
    <text x="831" y="325" fill="#22D3EE" font-size="14">按成本设不同预算</text>
    <rect x="970" y="228" width="182" height="118" rx="14" fill="#101A2E" stroke="#475569" stroke-width="2"/>
    <text x="1061" y="268" fill="#F8FAFC" font-size="19">全局并发</text>
    <text x="1061" y="299" fill="#94A3B8" font-size="15">保护队列与数据库</text>
    <text x="1061" y="325" fill="#22D3EE" font-size="14">过载时背压或拒绝</text>
  </g>
  <text x="54" y="404" fill="#9FB3D1" font-family="sans-serif" font-size="17">任一维度达到预算，都可以限制请求；高成本操作还要有独立的并发和资源上限。</text>
</svg>
