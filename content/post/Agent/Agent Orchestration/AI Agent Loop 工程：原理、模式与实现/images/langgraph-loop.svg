<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#1a1a2e"/><stop offset="100%" style="stop-color:#16213e"/></linearGradient>
    <linearGradient id="agent" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#667eea"/><stop offset="100%" style="stop-color:#764ba2"/></linearGradient>
    <linearGradient id="tools" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#43e97b"/><stop offset="100%" style="stop-color:#38f9d7"/></linearGradient>
    <linearGradient id="reflect" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f093fb"/><stop offset="100%" style="stop-color:#f5576c"/></linearGradient>
    <linearGradient id="human" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#fa709a"/><stop offset="100%" style="stop-color:#fee140"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#cbd5e0"/></marker>
    <marker id="arrow-yes" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#43e97b"/></marker>
    <marker id="arrow-no" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#f5576c"/></marker>
  </defs>

  <rect width="1100" height="700" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="1100" height="60" rx="16" fill="#0f0f23"/>
  <rect x="0" y="40" width="1100" height="20" fill="#0f0f23"/>
  <text x="550" y="38" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">LangGraph 实现 Agent Loop</text>

  <!-- START -->
  <circle cx="60" cy="340" r="24" fill="#43e97b"/>
  <text x="60" y="345" text-anchor="middle" fill="#0f0f23" font-size="12" font-weight="bold">START</text>

  <!-- Layout: agent centered at (340,340), tools at (650,160), reflect at (650,520), decisions at (840,340), human at (970,520), END at (1060,340) -->

  <!-- agent node -->
  <rect x="260" y="290" width="180" height="100" rx="14" fill="url(#agent)" filter="url(#shadow)" opacity="0.95"/>
  <text x="350" y="325" text-anchor="middle" fill="#fff" font-size="17" font-weight="bold">🤖 agent</text>
  <text x="350" y="350" text-anchor="middle" fill="#fff" font-size="11" opacity="0.9">LLM.bind_tools(tools)</text>
  <text x="350" y="368" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">step_count++</text>

  <!-- first decision: tool_calls? -->
  <polygon points="540,260 600,340 540,420 480,340" fill="#2d3748" stroke="#fbbf24" stroke-width="2"/>
  <text x="540" y="335" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">has</text>
  <text x="540" y="352" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">tool_calls?</text>

  <!-- tools node (top-right) -->
  <rect x="650" y="120" width="180" height="90" rx="14" fill="url(#tools)" filter="url(#shadow)" opacity="0.95"/>
  <text x="740" y="155" text-anchor="middle" fill="#fff" font-size="17" font-weight="bold">⚙️ tools</text>
  <text x="740" y="180" text-anchor="middle" fill="#fff" font-size="11" opacity="0.9">ToolNode(tools)</text>
  <text x="740" y="198" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">执行工具调用</text>

  <!-- reflect node (bottom-right) -->
  <rect x="650" y="490" width="180" height="90" rx="14" fill="url(#reflect)" filter="url(#shadow)" opacity="0.95"/>
  <text x="740" y="525" text-anchor="middle" fill="#fff" font-size="17" font-weight="bold">🔍 reflect</text>
  <text x="740" y="550" text-anchor="middle" fill="#fff" font-size="11" opacity="0.9">打分 + 改写</text>
  <text x="740" y="568" text-anchor="middle" fill="#fff" font-size="10" opacity="0.8">质量评估</text>

  <!-- second decision: step >= max or score OK? -->
  <polygon points="870,260 930,340 870,420 810,340" fill="#2d3748" stroke="#fbbf24" stroke-width="2"/>
  <text x="870" y="330" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">step ≥ max</text>
  <text x="870" y="348" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">or score OK?</text>

  <!-- human_review (bottom-right) -->
  <rect x="920" y="490" width="160" height="90" rx="14" fill="url(#human)" filter="url(#shadow)" opacity="0.95"/>
  <text x="1000" y="525" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">👤 human</text>
  <text x="1000" y="548" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">_review</text>
  <text x="1000" y="568" text-anchor="middle" fill="#fff" font-size="10" opacity="0.9">interrupt / 人工决策</text>

  <!-- END -->
  <circle cx="1060" cy="340" r="24" fill="#f5576c"/>
  <text x="1060" y="345" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">END</text>

  <!-- Arrows -->
  <!-- START -> agent -->
  <path d="M 84 340 L 260 340" stroke="#cbd5e0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- agent -> first decision -->
  <path d="M 440 340 L 480 340" stroke="#cbd5e0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- first decision YES -> tools (up-right) -->
  <path d="M 590 308 Q 620 230 650 200" stroke="#43e97b" stroke-width="2" fill="none" marker-end="url(#arrow-yes)"/>
  <text x="595" y="270" fill="#43e97b" font-size="12" font-weight="bold">YES</text>

  <!-- tools -> agent (loop back, top) -->
  <path d="M 650 165 Q 230 80 230 290 L 260 320" stroke="#cbd5e0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="380" y="80" text-anchor="middle" fill="#cbd5e0" font-size="11">tool result 追加到 messages</text>

  <!-- first decision NO -> reflect (down-right) -->
  <path d="M 590 372 Q 620 460 650 510" stroke="#f5576c" stroke-width="2" fill="none" marker-end="url(#arrow-no)"/>
  <text x="595" y="445" fill="#f5576c" font-size="12" font-weight="bold">NO</text>

  <!-- reflect -> agent (loop back, bottom) -->
  <path d="M 650 535 Q 230 640 230 390 L 260 360" stroke="#cbd5e0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="380" y="650" text-anchor="middle" fill="#cbd5e0" font-size="11">critique 追加,触发改写</text>

  <!-- reflect -> second decision -->
  <path d="M 830 535 L 870 380" stroke="#cbd5e0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- second decision YES -> END -->
  <path d="M 930 340 L 1036 340" stroke="#43e97b" stroke-width="2" fill="none" marker-end="url(#arrow-yes)"/>
  <text x="970" y="330" text-anchor="middle" fill="#43e97b" font-size="12" font-weight="bold">YES</text>

  <!-- second decision NO -> human_review -->
  <path d="M 870 420 L 870 470 L 920 510" stroke="#f5576c" stroke-width="2" fill="none" marker-end="url(#arrow-no)"/>
  <text x="860" y="475" fill="#f5576c" font-size="12" font-weight="bold">NO</text>

  <!-- human_review -> END (resume after approval) -->
  <path d="M 1080 535 Q 1090 440 1075 365" stroke="#cbd5e0" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="1100" y="450" text-anchor="end" fill="#cbd5e0" font-size="10" opacity="0.8">批准 → END</text>

  <!-- bottom note -->
  <text x="550" y="685" text-anchor="middle" fill="#94a3b8" font-size="11">所有节点 + 条件边构成完整 Agent Loop,支持持久化、断点续跑、人介入</text>
</svg>