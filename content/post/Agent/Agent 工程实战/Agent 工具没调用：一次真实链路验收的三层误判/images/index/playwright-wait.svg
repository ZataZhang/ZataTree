<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="自动选中首行后点击同一行不会产生第二次详情请求">
  <rect width="1200" height="430" rx="24" fill="#0B1220"/>
  <text x="60" y="70" fill="#F8FAFC" font-family="sans-serif" font-size="34" font-weight="700">Playwright 等待了不存在的第二次响应</text>
  <g font-family="sans-serif">
    <rect x="65" y="133" width="310" height="180" rx="18" fill="#17263D" stroke="#5B87BF" stroke-width="2"/>
    <text x="92" y="187" fill="#F8FAFC" font-size="25" font-weight="700">页面加载</text>
    <text x="92" y="228" fill="#9FB3D1" font-size="18">自动选中第一行</text>
