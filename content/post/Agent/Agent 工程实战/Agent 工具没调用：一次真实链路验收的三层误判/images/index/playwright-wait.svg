    <text x="852" y="228" fill="#9FB3D1" font-size="18">waitForResponse</text>
    <text x="852" y="264" fill="#E58E7A" font-size="18">等待第二次 GET</text>
  </g>
  <path d="M386 223h47m-13-12 13 12-13 12M766 223h47m-13-12 13 12-13 12" stroke="#52C3B1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="65" y="378" fill="#52C3B1" font-family="sans-serif" font-size="19">修复：判断 aria-current → 等详情面板可见 → 读取当前 Admin API 投影</text>
