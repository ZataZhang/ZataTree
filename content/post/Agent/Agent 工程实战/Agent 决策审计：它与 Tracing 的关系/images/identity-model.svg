<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495" role="img" aria-label="稳定身份与执行尝试">
<rect width="1200" height="495" fill="#0b1220"/>
<text x="40" y="58" font-family="sans-serif" font-size="32" font-weight="700" fill="#f8fafc">稳定身份与执行尝试</text>
<g font-family="sans-serif"><rect x="40" y="95" width="1120" height="84" rx="14" fill="#17263d" stroke="#5b87bf" stroke-width="2"/><rect x="40" y="95" width="8" height="84" rx="4" fill="#5b87bf"/><text x="70" y="128" font-size="25" font-weight="700" fill="#f8fafc">run_id · 业务任务</text><text x="70" y="160" font-size="19" fill="#b9c9df">跨暂停、恢复和重试保持稳定</text><rect x="40" y="200" width="1120" height="84" rx="14" fill="#17263d" stroke="#8b75d7" stroke-width="2"/><rect x="40" y="200" width="8" height="84" rx="4" fill="#8b75d7"/><text x="70" y="233" font-size="25" font-weight="700" fill="#f8fafc">decision_id · 判断版本</text><text x="70" y="265" font-size="19" fill="#b9c9df">绑定代码版本与政策版本</text><rect x="40" y="305" width="1120" height="84" rx="14" fill="#17263d" stroke="#38b6a8" stroke-width="2"/><rect x="40" y="305" width="8" height="84" rx="4" fill="#38b6a8"/><text x="70" y="338" font-size="25" font-weight="700" fill="#f8fafc">attempt_id / trace_id</text><text x="70" y="370" font-size="19" fill="#b9c9df">一次执行尝试及其诊断轨迹</text><text x="40" y="468" font-size="19" fill="#9fb3d1">一个业务任务可以有多次尝试，也可以产生多条 trace</text></g>
</svg>