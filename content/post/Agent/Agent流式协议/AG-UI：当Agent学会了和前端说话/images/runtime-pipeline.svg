<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#1a1a2e"/><stop offset="100%" style="stop-color:#16213e"/></linearGradient>
    <linearGradient id="agentbox" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#667eea"/><stop offset="100%" style="stop-color:#764ba2"/></linearGradient>
    <linearGradient id="uibox" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#43e97b"/><stop offset="100%" style="stop-color:#38f9d7"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#cbd5e0"/></marker>
  </defs>

  <rect width="900" height="640" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="60" rx="16" fill="#0f0f23"/>
  <rect x="0" y="40" width="900" height="20" fill="#0f0f23"/>
  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">一次 run 的运行管线:七环节</text>

  <!-- left: HTTP/SSE in -->
  <rect x="40" y="230" width="140" height="80" rx="12" fill="#2d3748" stroke="#4facfe" stroke-width="2"/>
  <text x="110" y="264" text-anchor="middle" fill="#cbd5e0" font-size="14" font-weight="bold">Agent.run()</text>
  <text x="110" y="286" text-anchor="middle" fill="#a0aec0" font-size="11">HTTP / SSE 请求</text>

  <!-- stages -->
  <g font-size="13">
    <rect x="230" y="90" width="330" height="46" rx="10" fill="#2d3748" stroke="#667eea" stroke-width="2"/>
    <text x="252" y="119" fill="#cbd5e0" font-weight="bold">① middleware 链</text>
    <text x="470" y="119" fill="#a0aec0" font-size="11" text-anchor="middle">reduceRight 洋葱模型</text>

    <rect x="230" y="150" width="330" height="46" rx="10" fill="#2d3748" stroke="#f5576c" stroke-width="2"/>
    <text x="252" y="179" fill="#cbd5e0" font-weight="bold">② transformChunks</text>
    <text x="470" y="179" fill="#a0aec0" font-size="11" text-anchor="middle">CHUNK → 三段式</text>

    <rect x="230" y="210" width="330" height="46" rx="10" fill="#2d3748" stroke="#f093fb" stroke-width="2"/>
    <text x="252" y="239" fill="#cbd5e0" font-weight="bold">③ verifyEvents</text>
    <text x="470" y="239" fill="#a0aec0" font-size="11" text-anchor="middle">事件文法状态机校验</text>

    <rect x="230" y="270" width="330" height="46" rx="10" fill="#2d3748" stroke="#fbbf24" stroke-width="2"/>
    <text x="252" y="299" fill="#cbd5e0" font-weight="bold">④ takeUntil(detach$)</text>
    <text x="470" y="299" fill="#a0aec0" font-size="11" text-anchor="middle">单次运行的中止信号</text>

    <rect x="230" y="330" width="330" height="46" rx="10" fill="#2d3748" stroke="#43e97b" stroke-width="2"/>
    <text x="252" y="359" fill="#cbd5e0" font-weight="bold">⑤ apply</text>
    <text x="470" y="359" fill="#a0aec0" font-size="11" text-anchor="middle">defaultApplyEvents 归约事件进状态</text>

    <rect x="230" y="390" width="330" height="46" rx="10" fill="#2d3748" stroke="#4facfe" stroke-width="2"/>
    <text x="252" y="419" fill="#cbd5e0" font-weight="bold">⑥ processApplyEvents</text>
    <text x="470" y="419" fill="#a0aec0" font-size="11" text-anchor="middle">分发到 subscriber 回调</text>

    <rect x="230" y="450" width="330" height="46" rx="10" fill="#2d3748" stroke="#a78bfa" stroke-width="2"/>
    <text x="252" y="479" fill="#cbd5e0" font-weight="bold">⑦ catchError / finalize</text>
    <text x="470" y="479" fill="#a0aec0" font-size="11" text-anchor="middle">错误处理与收尾</text>
  </g>

  <!-- arrows between stages -->
  <line x1="395" y1="136" x2="395" y2="148" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="395" y1="196" x2="395" y2="208" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="395" y1="256" x2="395" y2="268" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="395" y1="316" x2="395" y2="328" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="395" y1="376" x2="395" y2="388" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="395" y1="436" x2="395" y2="448" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- in arrow -->
  <path d="M 180 270 L 205 270 L 205 113 L 226 113" stroke="#cbd5e0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- right: subscriber out -->
  <rect x="620" y="330" width="230" height="110" rx="12" fill="#2d3748" stroke="#43e97b" stroke-width="2"/>
  <text x="735" y="362" text-anchor="middle" fill="#cbd5e0" font-size="14" font-weight="bold">Subscriber 回调</text>
  <text x="735" y="386" text-anchor="middle" fill="#a0aec0" font-size="11">生命周期 / 分事件 / 变更通知</text>
  <text x="735" y="408" text-anchor="middle" fill="#a0aec0" font-size="11">返回 AgentStateMutation</text>
  <text x="735" y="428" text-anchor="middle" fill="#a0aec0" font-size="11">由 runSubscribers 统一应用</text>

  <path d="M 562 413 L 618 390" stroke="#cbd5e0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="450" y="560" text-anchor="middle" fill="#7f8ea8" font-size="12">读懂这七个环节,你就读懂了 AG-UI 客户端(<tspan font-family="ui-monospace,Menlo,monospace" fill="#9fb3d1">packages/client/src/</tspan>)的全部</text>
  <text x="450" y="590" text-anchor="middle" fill="#5a6b8a" font-size="11" font-family="ui-monospace,Menlo,monospace">AbstractAgent.runAgent() · @ag-ui/client 0.0.59</text>
</svg>
