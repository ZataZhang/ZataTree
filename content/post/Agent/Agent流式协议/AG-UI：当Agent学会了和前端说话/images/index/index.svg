<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="AG-UI：当Agent学会了和前端说话">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C9CF5"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#26324a"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="#0B1220"/>
  <rect width="1200" height="400" fill="url(#dots)" opacity="0.55"/>
  <rect x="0" y="0" width="6" height="400" fill="url(#accent)"/>
  <text x="1104" y="64" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="20" fill="#64748B">zata.cc</text>
  <circle cx="940" cy="200" r="128" fill="none" stroke="#1c2a44" stroke-width="1.5"/>
  <!-- agent 节点(左) 经事件流(中) 到 UI 节点(右) -->
  <rect x="812" y="164" width="72" height="72" rx="14" fill="#0e1730" stroke="url(#accent)" stroke-width="2.5"/>
  <text x="848" y="207" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="26" fill="#7C9CF5">A</text>
  <rect x="996" y="164" width="72" height="72" rx="14" fill="#0e1730" stroke="#3b4a68" stroke-width="2.5"/>
  <rect x="1010" y="180" width="44" height="8" rx="4" fill="#3b4a68"/>
  <rect x="1010" y="196" width="44" height="8" rx="4" fill="#2c3a58"/>
  <rect x="1010" y="212" width="30" height="8" rx="4" fill="#2c3a58"/>
  <!-- 事件流:三个渐大的脉冲点 -->
  <line x1="892" y1="200" x2="988" y2="200" stroke="#2c3a58" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="912" cy="200" r="5" fill="#7C9CF5" opacity="0.35"/>
  <circle cx="938" cy="200" r="7" fill="#7C9CF5" opacity="0.6"/>
  <circle cx="964" cy="200" r="9" fill="#A78BFA"/>
  <!-- 事件类型标签 -->
  <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" fill="#4a5a7a">
    <text x="940" y="128" text-anchor="middle">RUN_STARTED</text>
    <text x="940" y="146" text-anchor="middle">TEXT_MESSAGE_*</text>
    <text x="940" y="272" text-anchor="middle">TOOL_CALL_*</text>
    <text x="940" y="290" text-anchor="middle">STATE_DELTA</text>
  </g>
  <text x="96" y="166" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="44" font-weight="700" fill="#F8FAFC">AG-UI：</text>
  <text x="96" y="238" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="44" font-weight="700" fill="#F8FAFC">当 Agent 学会了和前端说话</text>
  <rect x="96" y="264" width="112" height="6" rx="3" fill="url(#accent)"/>
  <rect x="96" y="296" width="186" height="42" rx="21" fill="#152238" stroke="#2c3a58" stroke-width="1.5"/>
  <text x="189" y="323" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="19" fill="#8ea3c8">Agent流式协议</text>
</svg>
