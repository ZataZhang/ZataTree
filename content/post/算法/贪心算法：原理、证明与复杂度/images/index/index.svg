<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="贪心算法：原理、证明与复杂度">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B87BF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="barOn" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2C5C8F"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#26324a"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="#0B1220"/>
  <rect width="1200" height="400" fill="url(#dots)" opacity="0.55"/>
  <rect x="0" y="0" width="6" height="400" fill="url(#accent)"/>

  <text x="1104" y="64" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="20" fill="#64748B">zata.cc</text>

  <!-- 右侧：按权重降序排列的候选序列，前四项被贪心接受 -->
  <g transform="translate(700,0)">
    <line x1="40" y1="290" x2="420" y2="290" stroke="#334155" stroke-width="1.6"/>
    <g fill="url(#barOn)">
      <rect x="52"  y="130" width="20" height="160" rx="3"/>
      <rect x="88"  y="152" width="20" height="138" rx="3"/>
      <rect x="124" y="176" width="20" height="114" rx="3"/>
      <rect x="160" y="198" width="20" height="92"  rx="3"/>
    </g>
    <g fill="#1e2a42">
      <rect x="196" y="218" width="20" height="72" rx="3"/>
      <rect x="232" y="236" width="20" height="54" rx="3"/>
      <rect x="268" y="250" width="20" height="40" rx="3"/>
      <rect x="304" y="262" width="20" height="28" rx="3"/>
      <rect x="340" y="272" width="20" height="18" rx="3"/>
      <rect x="376" y="279" width="20" height="11" rx="3"/>
    </g>
    <!-- 截断线：此处之后的候选不再被接受 -->
    <line x1="196" y1="96" x2="196" y2="300" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="7 5" opacity="0.9"/>
    <text x="204" y="88" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="17" fill="#F59E0B">截断</text>
    <text x="52" y="86" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="17" fill="#22D3EE">已接受</text>
    <g stroke="#475569" stroke-width="1.4" opacity="0.65">
      <line x1="62" y1="304" x2="62" y2="314"/><line x1="98" y1="304" x2="98" y2="314"/>
      <line x1="134" y1="304" x2="134" y2="314"/><line x1="170" y1="304" x2="170" y2="314"/>
      <line x1="206" y1="304" x2="206" y2="314"/><line x1="242" y1="304" x2="242" y2="314"/>
      <line x1="278" y1="304" x2="278" y2="314"/><line x1="314" y1="304" x2="314" y2="314"/>
      <line x1="350" y1="304" x2="350" y2="314"/><line x1="386" y1="304" x2="386" y2="314"/>
    </g>
    <text x="40" y="338" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="16" fill="#64748B">按 σ 降序扫描 · 保持可行</text>
  </g>

  <text x="96" y="166" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="48" font-weight="700" fill="#F8FAFC">贪心算法：</text>
  <text x="96" y="238" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="48" font-weight="700" fill="#F8FAFC">原理、证明与复杂度</text>
  <rect x="96" y="264" width="112" height="6" rx="3" fill="url(#accent)"/>

  <rect x="96" y="296" width="112" height="42" rx="21" fill="#152238" stroke="#2c3a58" stroke-width="1.5"/>
  <text x="114" y="324" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="21" fill="#9FB3D1">算法</text>
  <rect x="222" y="296" width="252" height="42" rx="21" fill="#152238" stroke="#2c3a58" stroke-width="1.5"/>
  <text x="240" y="324" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="21" fill="#9FB3D1">matroid · exchange</text>
</svg>
