<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="生成式大模型与决策模型的两条路径对比">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="360" rx="16" fill="#0B1220"/>

  <!-- lane 1 : generative -->
  <text x="48" y="118" font-family="sans-serif" font-size="17" fill="#94A3B8">生成式 LLM</text>

  <rect x="190" y="84" width="96" height="56" rx="8" fill="#131C2E" stroke="#475569"/>
  <text x="238" y="118" font-family="monospace" font-size="14" fill="#E2E8F0" text-anchor="middle">state</text>

  <line x1="290" y1="112" x2="302" y2="112" stroke="#475569" marker-end="url(#arw)"/>

  <rect x="306" y="84" width="330" height="56" rx="8" fill="#131C2E" stroke="#475569"/>
  <text x="471" y="110" font-family="sans-serif" font-size="15" fill="#E2E8F0" text-anchor="middle">一个 token 接一个 token 地写</text>
  <g fill="#38BDF8" opacity="0.75">
    <rect x="330" y="120" width="5" height="9" rx="1"/>
    <rect x="341" y="120" width="5" height="9" rx="1"/>
    <rect x="352" y="120" width="5" height="9" rx="1"/>
    <rect x="363" y="120" width="5" height="9" rx="1"/>
    <rect x="374" y="120" width="5" height="9" rx="1"/>
    <rect x="385" y="120" width="5" height="9" rx="1"/>
    <rect x="396" y="120" width="5" height="9" rx="1"/>
    <rect x="407" y="120" width="5" height="9" rx="1"/>
    <rect x="418" y="120" width="5" height="9" rx="1"/>
    <rect x="429" y="120" width="5" height="9" rx="1"/>
    <rect x="440" y="120" width="5" height="9" rx="1"/>
    <rect x="451" y="120" width="5" height="9" rx="1"/>
    <rect x="462" y="120" width="5" height="9" rx="1"/>
    <rect x="473" y="120" width="5" height="9" rx="1"/>
    <rect x="484" y="120" width="5" height="9" rx="1"/>
    <rect x="495" y="120" width="5" height="9" rx="1"/>
    <rect x="506" y="120" width="5" height="9" rx="1"/>
    <rect x="517" y="120" width="5" height="9" rx="1"/>
    <rect x="528" y="120" width="5" height="9" rx="1"/>
    <rect x="539" y="120" width="5" height="9" rx="1"/>
    <rect x="550" y="120" width="5" height="9" rx="1"/>
    <rect x="561" y="120" width="5" height="9" rx="1"/>
    <rect x="572" y="120" width="5" height="9" rx="1"/>
    <rect x="583" y="120" width="5" height="9" rx="1"/>
  </g>

  <line x1="640" y1="112" x2="652" y2="112" stroke="#475569" marker-end="url(#arw)"/>

  <rect x="656" y="84" width="140" height="56" rx="8" fill="#131C2E" stroke="#475569"/>
  <text x="726" y="118" font-family="sans-serif" font-size="15" fill="#E2E8F0" text-anchor="middle">解析回结构</text>

  <line x1="800" y1="112" x2="812" y2="112" stroke="#475569" marker-end="url(#arw)"/>

  <rect x="816" y="84" width="144" height="56" rx="8" fill="#131C2E" stroke="#475569"/>
  <text x="888" y="118" font-family="monospace" font-size="14" fill="#E2E8F0" text-anchor="middle">decision</text>

  <text x="190" y="172" font-family="sans-serif" font-size="14" fill="#64748B">慢、贵，还要处理解析失败和格式漂移</text>

  <!-- lane 2 : decision model -->
  <text x="48" y="258" font-family="sans-serif" font-size="17" fill="#A78BFA">决策模型</text>

  <rect x="190" y="224" width="176" height="56" rx="8" fill="#17203A" stroke="#8B5CF6"/>
  <text x="278" y="258" font-family="monospace" font-size="14" fill="#E2E8F0" text-anchor="middle">state + questions</text>

  <line x1="370" y1="252" x2="382" y2="252" stroke="#8B5CF6" marker-end="url(#arw)"/>

  <rect x="386" y="224" width="330" height="56" rx="8" fill="#17203A" stroke="#8B5CF6"/>
  <text x="551" y="258" font-family="sans-serif" font-size="15" fill="#E2E8F0" text-anchor="middle">一次算出所有候选的概率</text>

  <line x1="720" y1="252" x2="732" y2="252" stroke="#8B5CF6" marker-end="url(#arw)"/>

  <rect x="736" y="224" width="224" height="56" rx="8" fill="#17203A" stroke="#22D3EE"/>
  <text x="848" y="258" font-family="monospace" font-size="14" fill="#E2E8F0" text-anchor="middle">typed answers</text>

  <text x="190" y="312" font-family="sans-serif" font-size="14" fill="#64748B">并行、低延迟，输出直接就是结构</text>
</svg>
