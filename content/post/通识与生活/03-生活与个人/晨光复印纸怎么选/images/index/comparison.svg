<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="1200" height="480" rx="20" fill="#0B1220"/><text x="60" y="75" fill="#F8FAFC" font-family="sans-serif" font-size="34">同条件比较，才能看出系列差异</text><rect x="60.0" y="125" width="252.0" height="230" rx="16" fill="#17263D" stroke="#5B87BF"/><text x="84.0" y="180" fill="#72CBE2" font-family="sans-serif" font-size="27">尺寸</text><text x="84.0" y="245" fill="#F8FAFC" font-family="sans-serif" font-size="25">A4 对 A4</text><text x="84.0" y="305" fill="#B9C8DE" font-family="sans-serif" font-size="20">先排除幅面差异</text><rect x="336.0" y="125" width="252.0" height="230" rx="16" fill="#17263D" stroke="#5B87BF"/><text x="360.0" y="180" fill="#72CBE2" font-family="sans-serif" font-size="27">克重</text><text x="360.0" y="245" fill="#F8FAFC" font-family="sans-serif" font-size="25">70g 对 70g</text><text x="360.0" y="305" fill="#B9C8DE" font-family="sans-serif" font-size="20">80g 对 80g</text><rect x="612.0" y="125" width="252.0" height="230" rx="16" fill="#17263D" stroke="#5B87BF"/><text x="636.0" y="180" fill="#72CBE2" font-family="sans-serif" font-size="27">装量</text><text x="636.0" y="245" fill="#F8FAFC" font-family="sans-serif" font-size="25">总张数一致</text><text x="636.0" y="305" fill="#B9C8DE" font-family="sans-serif" font-size="20">确认当前选项</text><rect x="888.0" y="125" width="252.0" height="230" rx="16" fill="#17263D" stroke="#5B87BF"/><text x="912.0" y="180" fill="#72CBE2" font-family="sans-serif" font-size="27">价格</text><text x="912.0" y="245" fill="#F8FAFC" font-family="sans-serif" font-size="25">换算单张价</text><text x="912.0" y="305" fill="#B9C8DE" font-family="sans-serif" font-size="20">使用实际支出</text><text x="60" y="420" fill="#B9C8DE" font-family="sans-serif" font-size="21">颜色是检索入口；性能需要具体参数与打印结果支持。</text></svg>