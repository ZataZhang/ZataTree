<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="1200" height="480" rx="20" fill="#0B1220"/><text x="60" y="75" fill="#F8FAFC" font-family="sans-serif" font-size="34">70g / 80g：每平方米质量不同</text><rect x="60.0" y="125" width="344.0" height="230" rx="16" fill="#17263D" stroke="#5B87BF"/><text x="84.0" y="180" fill="#72CBE2" font-family="sans-serif" font-size="27">A4 · 70g/m²</text><text x="84.0" y="245" fill="#F8FAFC" font-family="sans-serif" font-size="25">单张约 4.37g</text><text x="84.0" y="305" fill="#B9C8DE" font-family="sans-serif" font-size="20">500张约 2.18kg</text><rect x="428.0" y="125" width="344.0" height="230" rx="16" fill="#17263D" stroke="#5B87BF"/><text x="452.0" y="180" fill="#72CBE2" font-family="sans-serif" font-size="27">A4 · 80g/m²</text><text x="452.0" y="245" fill="#F8FAFC" font-family="sans-serif" font-size="25">单张约 4.99g</text><text x="452.0" y="305" fill="#B9C8DE" font-family="sans-serif" font-size="20">500张约 2.49kg</text><rect x="796.0" y="125" width="344.0" height="230" rx="16" fill="#17263D" stroke="#5B87BF"/><text x="820.0" y="180" fill="#72CBE2" font-family="sans-serif" font-size="27">质量增加约14.3%</text><text x="820.0" y="245" fill="#F8FAFC" font-family="sans-serif" font-size="25">不代表厚度增幅</text><text x="820.0" y="305" fill="#B9C8DE" font-family="sans-serif" font-size="20">不代表不透明度增幅</text><text x="60" y="420" fill="#B9C8DE" font-family="sans-serif" font-size="21">理论计算：0.210 × 0.297 × 克重；不含包装，不是实测。</text></svg>