<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="1200" height="480" rx="20" fill="#0B1220"/><text x="60" y="75" fill="#F8FAFC" font-family="sans-serif" font-size="34">整箱比较：先换算到相同张数</text><rect x="60.0" y="125" width="344.0" height="230" rx="16" fill="#17263D" stroke="#5B87BF"/><text x="84.0" y="180" fill="#72CBE2" font-family="sans-serif" font-size="27">甲：90元 / 2500张</text><text x="84.0" y="245" fill="#F8FAFC" font-family="sans-serif" font-size="25">每千张 36元</text><text x="84.0" y="305" fill="#B9C8DE" font-family="sans-serif" font-size="20">5包 × 500张</text><rect x="428.0" y="125" width="344.0" height="230" rx="16" fill="#17263D" stroke="#5B87BF"/><text x="452.0" y="180" fill="#72CBE2" font-family="sans-serif" font-size="27">乙：136元 / 4000张</text><text x="452.0" y="245" fill="#F8FAFC" font-family="sans-serif" font-size="25">每千张 34元</text><text x="452.0" y="305" fill="#B9C8DE" font-family="sans-serif" font-size="20">8包 × 500张</text><rect x="796.0" y="125" width="344.0" height="230" rx="16" fill="#17263D" stroke="#5B87BF"/><text x="820.0" y="180" fill="#72CBE2" font-family="sans-serif" font-size="27">比较前提</text><text x="820.0" y="245" fill="#F8FAFC" font-family="sans-serif" font-size="25">相同尺寸与克重</text><text x="820.0" y="305" fill="#B9C8DE" font-family="sans-serif" font-size="20">同时确认运费与优惠</text><text x="60" y="420" fill="#B9C8DE" font-family="sans-serif" font-size="21">假设价格，仅演示计算方法；不代表任何晨光产品的实际售价。</text></svg>