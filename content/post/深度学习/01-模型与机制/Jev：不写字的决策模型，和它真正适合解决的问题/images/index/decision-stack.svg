<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="Agent 决策栈的四层分工">
  <rect x="0" y="0" width="1000" height="400" rx="16" fill="#0B1220"/>

  <text x="48" y="34" font-family="sans-serif" font-size="17" fill="#94A3B8">Agent 决策栈：谁负责哪一层判断</text>

  <!-- Code -->
  <rect x="48" y="56" width="140" height="64" rx="8" fill="#131C2E" stroke="#64748B"/>
  <text x="118" y="94" font-family="monospace" font-size="19" fill="#CBD5E1" text-anchor="middle">Code</text>
  <text x="224" y="82" font-family="sans-serif" font-size="15" fill="#E2E8F0">确定性判断</text>
  <text x="224" y="103" font-family="sans-serif" font-size="13" fill="#64748B">文件存在吗？HTTP 200 吗？exit code 是 0 吗？</text>

  <!-- Jev -->
  <rect x="48" y="134" width="140" height="64" rx="8" fill="#1B1633" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="118" y="172" font-family="monospace" font-size="19" fill="#A78BFA" text-anchor="middle">Jev</text>
  <text x="224" y="160" font-family="sans-serif" font-size="15" fill="#E2E8F0">语义闭集判断</text>
  <text x="224" y="181" font-family="sans-serif" font-size="13" fill="#64748B">这是哪类任务？该调哪个工具？风险几档？任务完成了吗？</text>

  <!-- LLM -->
  <rect x="48" y="212" width="140" height="64" rx="8" fill="#0E1B2B" stroke="#38BDF8"/>
  <text x="118" y="250" font-family="monospace" font-size="19" fill="#7DD3FC" text-anchor="middle">LLM</text>
  <text x="224" y="238" font-family="sans-serif" font-size="15" fill="#E2E8F0">开放式推理与生成</text>
  <text x="224" y="259" font-family="sans-serif" font-size="13" fill="#64748B">任务怎么拆？参数怎么构造？代码怎么改？报告怎么写？</text>

  <!-- Human -->
  <rect x="48" y="290" width="140" height="64" rx="8" fill="#2A1626" stroke="#F472B6"/>
  <text x="118" y="328" font-family="monospace" font-size="19" fill="#F9A8D4" text-anchor="middle">Human</text>
  <text x="224" y="316" font-family="sans-serif" font-size="15" fill="#E2E8F0">最终授权</text>
  <text x="224" y="337" font-family="sans-serif" font-size="13" fill="#64748B">删文件、覆盖项目、发邮件、花钱</text>
</svg>
