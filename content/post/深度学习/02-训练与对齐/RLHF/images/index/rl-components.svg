<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="856" viewBox="0 0 1200 856" role="img" aria-labelledby="title desc">
<title id="title">语言模型 RL：Reward Model 与 Critic 不同</title><desc id="desc">Actor 产生回答，奖励来源给结果打分；Critic 预测前缀回报帮助 PPO 计算优势；旧策略和参考策略各有职责。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#79AAEF" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="856" rx="24" fill="#0B1220"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="48" y="65" font-size="34" fill="#F8FAFC" font-weight="600">语言模型 RL：Reward Model 与 Critic 不同</text>
<text x="48" y="108" font-size="25" fill="#B5C7DE" font-weight="400">打分、预测回报、记录采样概率和约束漂移，职责各不相同。</text><rect x="48" y="150" width="500" height="145" rx="18" fill="#132238" stroke="#79AAEF" stroke-width="2"/><text x="78" y="197" font-size="30" fill="#79AAEF" font-weight="600">Actor / 当前策略</text><text x="78" y="243" font-size="27" fill="#F8FAFC" font-weight="400">生成回答；更新参数</text><rect x="652" y="150" width="500" height="145" rx="18" fill="#132238" stroke="#61D4C3" stroke-width="2"/><text x="682" y="197" font-size="30" fill="#61D4C3" font-weight="600">Reward / Verifier</text><text x="682" y="243" font-size="27" fill="#F8FAFC" font-weight="400">评价生成结果；输出奖励</text><path d="M548 211 L642 211" fill="none" stroke="#79AAEF" stroke-width="3" marker-end="url(#arrow)"/><text x="558" y="193" font-size="20" fill="#B5C7DE" font-weight="400">回答</text><rect x="48" y="365" width="500" height="145" rx="18" fill="#132238" stroke="#C3AAFF" stroke-width="2"/><text x="78" y="412" font-size="30" fill="#C3AAFF" font-weight="600">Critic / Value</text><text x="78" y="458" font-size="27" fill="#F8FAFC" font-weight="400">从前缀预测后续回报</text><rect x="652" y="365" width="500" height="145" rx="18" fill="#132238" stroke="#79AAEF" stroke-width="2"/><text x="682" y="412" font-size="30" fill="#79AAEF" font-weight="600">优势 Advantage</text><text x="682" y="458" font-size="27" fill="#F8FAFC" font-weight="400">判断结果相对基准的好坏</text><path d="M902 295 L902 355" fill="none" stroke="#61D4C3" stroke-width="3" marker-end="url(#arrow)"/><path d="M548 438 L642 438" fill="none" stroke="#C3AAFF" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="553" font-size="25" fill="#B5C7DE" font-weight="400">PPO：Critic 参与优势估计；GRPO / DAPO：用同题组内奖励比较。</text><rect x="48" y="598" width="500" height="140" rx="18" fill="#132238" stroke="#79AAEF" stroke-width="2"/><text x="78" y="642" font-size="28" fill="#79AAEF" font-weight="600">Old Policy / 旧策略概率</text><text x="78" y="688" font-size="25" fill="#F8FAFC" font-weight="400">来自当前 rollout，用于概率比</text><rect x="652" y="598" width="500" height="140" rx="18" fill="#132238" stroke="#C3AAFF" stroke-width="2"/><text x="682" y="642" font-size="28" fill="#C3AAFF" font-weight="600">Reference / 参考策略</text><text x="682" y="688" font-size="25" fill="#F8FAFC" font-weight="400">用于 KL；是否需要取决于配置</text><text x="48" y="785" font-size="25" fill="#B5C7DE" font-weight="400">这些是逻辑角色：可共享骨干、缓存概率，奖励也可以直接用规则。</text>
<text x="48" y="830" font-size="20" fill="#B5C7DE" font-weight="400">zata.cc · 原理示意，非实验结果</text>
</g></svg>