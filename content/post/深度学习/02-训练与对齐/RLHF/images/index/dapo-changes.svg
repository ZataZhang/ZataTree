<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="836" viewBox="0 0 1200 836" role="img" aria-labelledby="title desc">
<title id="title">DAPO：探索、采样、损失、长度一起看</title><desc id="desc">四项改动分别为非对称裁剪、动态采样、token 级聚合和超长奖励处理；需要联合观察验证表现与实际成本。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#79AAEF" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="836" rx="24" fill="#0B1220"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="48" y="65" font-size="34" fill="#F8FAFC" font-weight="600">DAPO：探索、采样、损失、长度一起看</text>
<text x="48" y="107" font-size="25" fill="#B5C7DE" font-weight="400">沿用组相对优势，在训练循环的四处调整。</text><rect x="48" y="150" width="528" height="238" rx="18" fill="#132238" stroke="#79AAEF" stroke-width="2"/><text x="73" y="197" font-size="28" fill="#79AAEF" font-weight="600">01 · Clip-Higher</text><text x="73" y="248" font-size="24" fill="#F8FAFC" font-weight="400">问题：探索过早收缩</text><text x="73" y="293" font-size="26" fill="#F8FAFC" font-weight="400">把裁剪上下界分开</text><text x="73" y="341" font-size="24" fill="#B5C7DE" font-weight="400">给正优势动作更多增长空间</text><rect x="624" y="150" width="528" height="238" rx="18" fill="#132238" stroke="#61D4C3" stroke-width="2"/><text x="649" y="197" font-size="28" fill="#61D4C3" font-weight="600">02 · Dynamic Sampling</text><text x="649" y="248" font-size="24" fill="#F8FAFC" font-weight="400">问题：有效问题组不足</text><text x="649" y="293" font-size="26" fill="#F8FAFC" font-weight="400">过滤组内无差异的组</text><text x="649" y="341" font-size="24" fill="#B5C7DE" font-weight="400">在预算内补足训练批次</text><rect x="48" y="430" width="528" height="238" rx="18" fill="#132238" stroke="#C3AAFF" stroke-width="2"/><text x="73" y="477" font-size="28" fill="#C3AAFF" font-weight="600">03 · Token-Level Loss</text><text x="73" y="528" font-size="24" fill="#F8FAFC" font-weight="400">问题：长短回答 token 权重不同</text><text x="73" y="573" font-size="26" fill="#F8FAFC" font-weight="400">按有效 token 统一聚合</text><text x="73" y="621" font-size="24" fill="#B5C7DE" font-weight="400">长回答的总权重随长度增加</text><rect x="624" y="430" width="528" height="238" rx="18" fill="#132238" stroke="#79AAEF" stroke-width="2"/><text x="649" y="477" font-size="28" fill="#79AAEF" font-weight="600">04 · Overlong Shaping</text><text x="649" y="528" font-size="24" fill="#F8FAFC" font-weight="400">问题：截断混入错误信号</text><text x="649" y="573" font-size="26" fill="#F8FAFC" font-weight="400">区分截断过滤与软长度惩罚</text><text x="649" y="621" font-size="24" fill="#B5C7DE" font-weight="400">检查正确率、截断率和长度</text><text x="48" y="719" font-size="26" fill="#B5C7DE" font-weight="400">原始数学实验移除显式参考 KL；迁移任务需重新评估。</text><text x="48" y="762" font-size="26" fill="#B5C7DE" font-weight="400">同时记录被过滤的生成成本，逐项对照验证集表现。</text>
<text x="48" y="810" font-size="20" fill="#B5C7DE" font-weight="400">zata.cc · 原理示意，非实验结果</text>
</g></svg>