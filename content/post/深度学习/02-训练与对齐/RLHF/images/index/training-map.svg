<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="956" viewBox="0 0 1200 956" role="img" aria-labelledby="title desc">
<title id="title">训练全景：阶段、奖励、算法是不同维度</title><desc id="desc">预训练、SFT 后可选择离线偏好优化或在线强化学习，在线训练的反馈来源独立于策略优化算法。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#79AAEF" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="956" rx="24" fill="#0B1220"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="48" y="65" font-size="34" fill="#F8FAFC" font-weight="600">训练全景：阶段、奖励、算法是不同维度</text>
<text x="48" y="106" font-size="25" fill="#B5C7DE" font-weight="400">先看训练数据，再看反馈来源，最后看优化方法。</text><rect x="48" y="142" width="1104" height="128" rx="18" fill="#132238" stroke="#79AAEF" stroke-width="2"/><text x="78" y="184" font-size="30" fill="#79AAEF" font-weight="600">① Pre-training / CPT</text><text x="78" y="227" font-size="27" fill="#F8FAFC" font-weight="400">原始文本 → 下一个 token 预测 → 通用或领域基座</text><path d="M600 270 L600 311" fill="none" stroke="#79AAEF" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="326" width="1104" height="128" rx="18" fill="#132238" stroke="#61D4C3" stroke-width="2"/><text x="78" y="368" font-size="30" fill="#61D4C3" font-weight="600">② SFT · 监督微调</text><text x="78" y="411" font-size="27" fill="#F8FAFC" font-weight="400">指令 + 示范回答 → 学习任务行为与输出形式</text><path d="M340 454 L340 500" fill="none" stroke="#79AAEF" stroke-width="3" marker-end="url(#arrow)"/><path d="M860 454 L860 500" fill="none" stroke="#79AAEF" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="516" width="540" height="170" rx="18" fill="#132238" stroke="#C3AAFF" stroke-width="2"/><text x="78" y="560" font-size="29" fill="#C3AAFF" font-weight="600">③A 离线偏好优化</text><text x="78" y="605" font-size="27" fill="#F8FAFC" font-weight="400">已有偏好对 → DPO</text><text x="78" y="650" font-size="24" fill="#B5C7DE" font-weight="400">原始形式无需在线 rollout</text><rect x="612" y="516" width="540" height="170" rx="18" fill="#132238" stroke="#79AAEF" stroke-width="2"/><text x="642" y="560" font-size="29" fill="#79AAEF" font-weight="600">③B 在线强化学习</text><text x="642" y="605" font-size="27" fill="#F8FAFC" font-weight="400">生成 → 打分 → 策略更新</text><text x="642" y="650" font-size="26" fill="#B5C7DE" font-weight="400">PPO / GRPO / DAPO</text><rect x="48" y="720" width="1104" height="125" rx="18" fill="#132238" stroke="#61D4C3" stroke-width="2"/><text x="78" y="762" font-size="29" fill="#61D4C3" font-weight="600">在线 RL 的奖励从哪里来？</text><text x="78" y="807" font-size="26" fill="#F8FAFC" font-weight="400">人类偏好：RLHF  ·  AI 反馈：RLAIF  ·  可验证规则：RLVR</text><text x="48" y="889" font-size="25" fill="#B5C7DE" font-weight="400">常见路线可重排：R1-Zero 从基座直接 RL；后训练也可多轮交替。</text>
<text x="48" y="930" font-size="20" fill="#B5C7DE" font-weight="400">zata.cc · 原理示意，非实验结果</text>
</g></svg>