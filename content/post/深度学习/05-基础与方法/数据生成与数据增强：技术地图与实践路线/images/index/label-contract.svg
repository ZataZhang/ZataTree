<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">增强中的标签处理规则</title><desc id="desc">分类可保持标签，检测框随图变换，文本否定变化要重新判断标签。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="730" rx="20" fill="#0b1220"/>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#e2e8f0}.title{font-size:34px;font-weight:700;fill:#f8fafc}.heading{font-size:27px;font-weight:700}.body{font-size:23px}.small{font-size:20px;fill:#9fb3d1}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="48" y="65" class="title">先约定变换，再约定标签怎样变化</text>
<rect x="48" y="110" width="1104" height="170" rx="16" fill="#111e32" stroke="#263a55" stroke-width="2"/>
<text x="72" y="150" class="heading" style="fill:#93c5fd">01  分类：合理光照变化，保持类别</text>
<rect x="48" y="300" width="1104" height="170" rx="16" fill="#111e32" stroke="#263a55" stroke-width="2"/>
<text x="72" y="340" class="heading" style="fill:#5eead4">02  检测：翻转图像，同步翻转检测框</text>
<rect x="48" y="490" width="1104" height="170" rx="16" fill="#111e32" stroke="#263a55" stroke-width="2"/>
<text x="72" y="530" class="heading" style="fill:#fbbf24">03  文本：否定词改变，原标签不能直接沿用</text>
<rect x="100" y="174" width="120" height="68" rx="10" fill="#1e3a5f"/>
<path d="M125 220 L137 190 L152 201 L170 201 L185 190 L198 220 Z" fill="#e2e8f0"/>
<rect x="590" y="174" width="120" height="68" rx="10" fill="#416a94"/>
<path d="M615 220 L627 190 L642 201 L660 201 L675 190 L688 220 Z" fill="#e2e8f0"/>
<text x="242" y="216" class="body">类别：猫</text>
<path d="M455 211 L548 211" class="line"/>
<text x="740" y="206" class="body">调亮之后：仍为猫</text>
<text x="740" y="240" class="small">前提：目标仍可识别</text>
<rect x="100" y="364" width="140" height="72" rx="8" fill="#23364e"/>
<rect x="115" y="379" width="60" height="42" fill="#3b6f72" stroke="#5eead4" stroke-width="3"/>
<rect x="590" y="364" width="140" height="72" rx="8" fill="#23364e"/>
<rect x="650" y="379" width="60" height="42" fill="#3b6f72" stroke="#5eead4" stroke-width="3"/>
<text x="268" y="406" class="body">目标在左侧</text>
<path d="M455 403 L548 403" class="line"/>
<text x="770" y="395" class="body">图像与框一起变换</text>
<text x="770" y="430" class="small">只翻图、不改框 → 错标</text>
<text x="90" y="600" class="body">「这个产品不好用」</text>
<text x="90" y="640" class="small">标签：负面</text>
<path d="M455 602 L548 602" class="line"/>
<text x="590" y="600" class="body">「这个产品好用」</text>
<text x="590" y="640" class="small">删除“不”后，需重新判断标签</text>
<text x="48" y="703" class="small">机制示意 · 可否保持标签，取决于具体任务</text>
</svg>