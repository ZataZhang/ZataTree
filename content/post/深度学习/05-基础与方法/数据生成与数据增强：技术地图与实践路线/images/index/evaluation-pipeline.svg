<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">数据扩充的评估流程</title><desc id="desc">先分组切分真实数据，在训练侧生成增强，通过验证集选方案，只在最后使用独立测试集。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="800" rx="20" fill="#0b1220"/>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#e2e8f0}.title{font-size:34px;font-weight:700;fill:#f8fafc}.heading{font-size:27px;font-weight:700}.body{font-size:23px}.small{font-size:20px;fill:#9fb3d1}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="48" y="65" class="title">先隔离评估数据，再开发生成与增强策略</text>
<text x="48" y="104" class="small">同一患者、文档或原始样本的衍生数据，遵守同一分组边界。</text>
<rect x="398" y="135" width="404" height="65" rx="16" fill="#111e32" stroke="#263a55" stroke-width="2"/>
<text x="448" y="178" class="heading">真实数据：按组 / 时间切分</text>
<rect x="48" y="260" width="312" height="70" rx="16" fill="#111e32" stroke="#263a55" stroke-width="2"/>
<text x="76" y="307" class="heading" style="fill:#93c5fd">训练集</text>
<rect x="444" y="260" width="312" height="70" rx="16" fill="#111e32" stroke="#263a55" stroke-width="2"/>
<text x="472" y="307" class="heading" style="fill:#5eead4">验证集</text>
<rect x="840" y="260" width="312" height="70" rx="16" fill="#111e32" stroke="#263a55" stroke-width="2"/>
<text x="868" y="307" class="heading" style="fill:#fbbf24">独立测试集</text>
<path d="M600 202 L600 228 L204 228 L204 251" class="line"/>
<path d="M600 202 L600 251" class="line"/>
<path d="M600 202 L600 228 L996 228 L996 251" class="line"/>
<rect x="48" y="390" width="312" height="62" rx="16" fill="#111e32" stroke="#263a55" stroke-width="2"/>
<text x="72" y="430" class="body">拟合缩放器 / 生成器</text>
<path d="M204 330 L204 381" class="line"/>
<rect x="48" y="474" width="312" height="62" rx="16" fill="#111e32" stroke="#263a55" stroke-width="2"/>
<text x="72" y="514" class="body">生成与增强</text>
<path d="M204 452 L204 465" class="line"/>
<rect x="48" y="558" width="312" height="62" rx="16" fill="#111e32" stroke="#263a55" stroke-width="2"/>
<text x="72" y="598" class="body">过滤 · 去重 · 训练</text>
<path d="M204 536 L204 549" class="line"/>
<rect x="444" y="390" width="312" height="230" rx="16" fill="#111e32" stroke="#263a55" stroke-width="2"/>
<text x="470" y="437" class="heading" style="fill:#5eead4">比较候选方案</text>
<text x="470" y="486" class="body">策略 · 强度 · 合成比例</text>
<text x="470" y="532" class="body">预先约定选择指标</text>
<text x="470" y="581" class="small">保留成本与分组结果</text>
<path d="M360 589 L435 589" class="line"/>
<path d="M600 330 L600 381" class="line"/>
<rect x="840" y="390" width="312" height="230" rx="16" fill="#111e32" stroke="#263a55" stroke-width="2"/>
<text x="866" y="437" class="heading" style="fill:#fbbf24">方案确定后再评估</text>
<text x="866" y="486" class="body">保持真实来源与分布</text>
<text x="866" y="532" class="body">检查总体与稀有场景</text>
<text x="866" y="581" class="small">不参与生成或参数选择</text>
<path d="M996 330 L996 381" class="line"/>
<rect x="48" y="680" width="1104" height="75" rx="16" fill="#14253b" stroke="#263a55" stroke-width="2"/>
<text x="77" y="728" class="heading">对照实验：原始数据 ｜ 加增强 ｜ 加合成 ｜ 两者同时加入</text>
<path d="M600 620 L600 671" class="line"/>
<path d="M756 705 L798 705 L798 650 L996 650 L996 629" class="line"/>
<text x="48" y="782" class="small">实验设计示意 · 新增数据的效用由独立真实评估判断</text>
</svg>