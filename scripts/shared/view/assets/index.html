<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>只读文件与改动查看器</title>
<link rel="stylesheet" href="/assets/viewer.css">
</head>
<body>

<div class="app">
  <!-- 顶部工具条 -->
  <header class="surface topbar">
    <span class="repo">
      <span class="repo-mark" aria-hidden="true">▤</span>
      <span id="repo-name">本仓库</span>
    </span>
    <span class="chip mono" id="branch-chip">…</span>

    <div class="spacer"></div>

    <div class="segmented" role="tablist" aria-label="视图切换">
      <button type="button" role="tab" id="tab-files" aria-selected="false">文件</button>
      <button type="button" role="tab" id="tab-diff" aria-selected="true">
        改动 <span class="seg-count" id="diff-count" hidden>0</span>
      </button>
    </div>

    <label class="filter">
      <span aria-hidden="true">⌕</span>
      <input id="filter-input" type="search" placeholder="过滤文件…" autocomplete="off">
    </label>

    <!-- 手动刷新：页面刻意不做任何轮询，所以「看到最新状态」这件事是个显式动作。 -->
    <button type="button" class="head-action" id="refresh-view"
            title="重新读取文件树与当前内容（页面不会自动刷新）">
      <svg class="icon-refresh" viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      <svg class="icon-check" viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span>刷新</span>
    </button>
    <!-- 正计时：距上次刷新的时长。纯本地计时，不发任何请求（「不轮询」那条口径说的是请求）。 -->
    <span class="refresh-timer" id="refresh-timer" title="距上次刷新"></span>
  </header>

  <!-- 主体：左树右内容 -->
  <div class="body-grid">
    <aside class="surface tree">
      <div class="tree-head">
        <span id="tree-title"><b>文件树</b></span>
        <span id="tree-note">加载中…</span>
      </div>
      <div class="tree-body" id="tree-body" role="tree" aria-label="文件树"></div>
    </aside>

    <main class="surface viewer">
      <div class="viewer-head">
        <span class="viewer-path" id="viewer-path">—</span>
        <button type="button" id="copy-path" class="copy-path" aria-label="复制文件路径" title="复制文件路径" hidden>
          <svg class="icon-copy" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <svg class="icon-check" viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>

        <!-- 预览控件：只在当前文件支持预览时出现。默认停在「源码」，预览是一次显式切换。 -->
        <div class="segmented preview-switch" id="preview-switch" role="tablist" aria-label="预览切换" hidden>
          <button type="button" role="tab" id="tab-source" aria-selected="true">源码</button>
          <button type="button" role="tab" id="tab-preview" aria-selected="false">预览</button>
        </div>
        <!-- 从改动跳到文件：只在改动视图选中了条目时出现。 -->
        <button type="button" class="head-action" id="open-file" title="切到文件视图，查看该文件的完整正文" hidden>查看文件</button>
        <a class="head-action" id="open-external" target="_blank" rel="noopener" hidden>在新标签页打开</a>

        <span class="viewer-meta" id="viewer-meta"></span>
      </div>
      <div class="viewer-body" id="viewer-body"></div>
    </main>
  </div>

  <!-- 图片放大层：内容区里点任意图片就铺满这一层，按原始像素看。点任意处或 Esc 关掉。 -->
  <div class="image-zoom" id="image-zoom" role="dialog" aria-label="图片放大" hidden>
    <img id="image-zoom-img" alt="">
    <p class="image-zoom-caption" id="image-zoom-caption"></p>
  </div>

  <!-- 状态条 -->
  <footer class="surface statusbar">
    <span class="dot" id="status-dot"></span>
    <span id="status-text">只读视图 · 服务运行中</span>
    <span class="spacer"></span>
    <span id="status-hint"></span>
    <span class="kbd">f</span> 文件
    <span class="kbd">d</span> 改动
    <span class="kbd">/</span> 过滤
  </footer>
</div>

<script src="/assets/viewer.js"></script>
</body>
</html>
